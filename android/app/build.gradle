plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePath = System.getenv("KEYSTORE_PATH") ?: "release.jks"
def keystoreFile = file(keystorePath).exists() ? file(keystorePath) : rootProject.file("app/" + keystorePath)
if (!keystoreFile.exists()) {
    keystoreFile = file("release.jks")
}

def envKeystorePassword = System.getenv("KEYSTORE_PASSWORD")
def envKeyAlias = System.getenv("KEY_ALIAS")
def envKeyPassword = System.getenv("KEY_PASSWORD")

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.kamlesh.moneymanager"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.kamlesh.moneymanager"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            if (envKeystorePassword != null && !envKeystorePassword.trim().isEmpty() && envKeyAlias != null && !envKeyAlias.trim().isEmpty()) {
                if (!keystoreFile.exists()) {
                    def errorMsg = "❌ Keystore file not found at: '${keystoreFile.absolutePath}' (KEYSTORE_PATH='${keystorePath}'). Please ensure KEYSTORE_BASE64 is properly configured."
                    logger.error(errorMsg)
                    println(errorMsg)
                    throw new FileNotFoundException(errorMsg)
                }
                storeFile = keystoreFile
                storePassword = envKeystorePassword
                keyAlias = envKeyAlias
                keyPassword = envKeyPassword
            } else if (keystorePropertiesFile.exists() && keystoreProperties['storeFile'] != null) {
                def propStoreFile = file(keystoreProperties['storeFile'])
                if (!propStoreFile.exists()) {
                    propStoreFile = rootProject.file(keystoreProperties['storeFile'])
                }
                if (!propStoreFile.exists()) {
                    def errorMsg = "❌ Keystore file '${keystoreProperties['storeFile']}' defined in key.properties not found."
                    logger.error(errorMsg)
                    println(errorMsg)
                    throw new FileNotFoundException(errorMsg)
                }
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = propStoreFile
                storePassword = keystoreProperties['storePassword']
            } else {
                // Graceful fallback to debug key if release keystore is not yet set
                keyAlias = signingConfigs.debug.keyAlias
                keyPassword = signingConfigs.debug.keyPassword
                storeFile = signingConfigs.debug.storeFile
                storePassword = signingConfigs.debug.storePassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
}
