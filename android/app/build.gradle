plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def envKeystorePath = System.getenv("KEYSTORE_PATH")
def envKeystorePassword = System.getenv("KEYSTORE_PASSWORD")
def envKeyAlias = System.getenv("KEY_ALIAS")
def envKeyPassword = System.getenv("KEY_PASSWORD")

File keystoreFile = null
if (envKeystorePath != null && !envKeystorePath.trim().isEmpty()) {
    def f1 = rootProject.file(envKeystorePath)
    def f2 = file(envKeystorePath)
    def f3 = new File(envKeystorePath)
    if (f1.exists()) {
        keystoreFile = f1
    } else if (f2.exists()) {
        keystoreFile = f2
    } else if (f3.exists()) {
        keystoreFile = f3
    } else {
        keystoreFile = file(envKeystorePath)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.kamlesh.moneymanager"
    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.kamlesh.moneymanager"
        minSdk = 21
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            if (envKeystorePath != null && !envKeystorePath.trim().isEmpty() && keystoreFile != null) {
                storeFile = keystoreFile
                storePassword = envKeystorePassword
                keyAlias = envKeyAlias
                keyPassword = envKeyPassword
            } else if (keystorePropertiesFile.exists() && keystoreProperties['storeFile'] != null) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            } else {
                // Graceful fallback to debug key if release keystore is not yet set
                keyAlias = signingConfigs.debug.keyAlias
                keyPassword = signingConfigs.debug.keyPassword
                storeFile = signingConfigs.debug.storeFile
                storePassword = signingConfigs.debug.storePassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
}
