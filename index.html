<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wallet Manager</title>
<meta name="theme-color" content="#0e0f14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23121524'/%3E%3Crect x='22' y='20' width='56' height='26' rx='6' fill='%23ff3b56'/%3E%3Crect x='16' y='32' width='68' height='48' rx='14' fill='%231b2034' stroke='%232979ff' stroke-width='3.5'/%3E%3Ccircle cx='76' cy='58' r='4' fill='%23ff3b56'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0e0f14;--c1:#151822;--c2:#1e2333;--c3:#2a3148;--ink:#f5f6fb;--mu:#8a91a8;--ln:#24283b;--inc:#2979ff;--exp:#ff3b56;--trf:#8c7ae6;--acc:#2979ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f2f4fa;--c1:#fff;--c2:#e8ecf6;--c3:#dbe1f2;--ink:#111420;--mu:#6a728a;--ln:#dce1ef;--inc:#1976d2;--exp:#e53935;--trf:#7b1fa2;--acc:#1976d2;color-scheme:light}}
:root[data-theme=light]{--bg:#f2f4fa;--c1:#fff;--c2:#e8ecf6;--c3:#dbe1f2;--ink:#111420;--mu:#6a728a;--ln:#dce1ef;--inc:#1976d2;--exp:#e53935;--trf:#7b1fa2;--acc:#1976d2;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:500 14px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,.big,.num{font-family:Sora,'Plus Jakarta Sans',sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:480px;margin:0 auto;padding:12px 14px 110px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}.top small{color:var(--mu);font-size:12px;font-weight:600}.top h1{font-size:21px;font-weight:800}
.btn{background:var(--c1);border:1px solid var(--ln);border-radius:12px;padding:6px 12px;font-size:12px;font-weight:700}.btn.sy{border-color:var(--inc);color:var(--inc)}
.hero{background:linear-gradient(135deg,#19233f,#131724);color:#fff;border-radius:24px;padding:18px;border:1px solid rgba(255,255,255,.06)}
.hero small{opacity:.8;font-size:12.5px;font-weight:600}.big{font-size:32px;font-weight:800;letter-spacing:-1px;margin:2px 0 12px}
.chips{display:flex;gap:8px}.chips span{background:rgba(12,14,22,.7);padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:700}.chips i{font-style:normal}
.bar2{margin:14px 0 10px}
.mn{display:inline-flex;align-items:center;background:var(--c1);border-radius:99px;padding:2px;border:1px solid var(--ln)}.mn button{width:28px;height:28px;font-size:17px;text-align:center}.mn b{min-width:78px;text-align:center;font-size:12.5px}
.sg{display:flex;background:var(--c1);border-radius:99px;padding:2px;border:1px solid var(--ln)}.sg button{padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700;color:var(--mu);text-align:center}.sg .on{background:var(--c2);color:var(--ink)}
.day{background:var(--c1);border-radius:18px;padding:4px 14px;margin-bottom:10px;border:1px solid var(--ln)}.dh{display:flex;justify-content:space-between;padding:9px 0 5px;color:var(--mu);font-size:12px;font-weight:700}
.r{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 0}.r+.r{border-top:1px solid var(--ln)}.ic{width:38px;height:38px;border-radius:14px;background:var(--c2);display:grid;place-items:center;font-size:19px}.r small{display:block;color:var(--mu);font-size:11.5px}.num{font-weight:700;font-size:14.5px}
.i{color:var(--inc)}.e{color:var(--exp)}.t{color:var(--trf)}.empty{text-align:center;color:var(--mu);padding:40px 10px;font-size:13px}
.acc{width:100%;background:var(--c1);border:1px solid var(--ln);border-radius:18px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}.acl{display:flex;align-items:center;gap:10px}.aci{width:36px;height:36px;border-radius:12px;background:var(--c2);display:grid;place-items:center;font-size:18px}.acc small{color:var(--mu);font-size:11px}
.card{background:var(--c1);border-radius:20px;padding:16px;margin-bottom:10px;border:1px solid var(--ln)}.card h2{font-size:14.5px;margin-bottom:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.grid3>div{background:var(--c1);border-radius:16px;padding:10px;border:1px solid var(--ln)}.grid3 small{color:var(--mu);font-size:10.5px;display:block}.grid3 b{font-family:Sora;font-size:13px}
.ring{display:block;margin:4px auto 10px;width:190px;height:190px}.lg{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:8px 0}.lg i{width:10px;height:10px;border-radius:3px}.lg .bt{grid-column:2/4;height:5px;border-radius:4px;background:var(--c2);overflow:hidden}.lg .bt u{display:block;height:100%}
.wk{display:flex;align-items:flex-end;gap:6px;height:95px}.wk div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:10.5px;color:var(--mu)}.wk i{width:100%;border-radius:6px;background:var(--exp);min-height:4px}
.more{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.mi{background:var(--c1);border:1px solid var(--ln);border-radius:18px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}.mi:active{transform:scale(.97)}.mic{width:42px;height:42px;border-radius:14px;background:var(--c2);display:grid;place-items:center;font-size:20px}.mi span{font-size:12px;font-weight:700}
.foot{text-align:center;margin:28px 0 8px;color:var(--mu);font-size:11.5px}
.pg{position:fixed;inset:0;background:var(--bg);z-index:25;display:none;flex-direction:column;overflow:hidden}.pg.on{display:flex}.pg .in{max-width:480px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:10px 14px;overflow-y:auto}
.ph{display:flex;align-items:center;gap:10px;padding:4px 0 10px}.ph h2{flex:1;font-size:18px}.ph button{width:38px;height:38px;border-radius:12px;background:var(--c1);text-align:center;border:1px solid var(--ln)}
.tp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.tp button{padding:10px;border-radius:14px;background:var(--c1);font-weight:700;text-align:center;border:2px solid transparent;font-size:13px}
.fl{display:grid;grid-template-columns:85px 1fr;align-items:center;padding:11px 4px;border-bottom:1px solid var(--ln);width:100%}.fl label{color:var(--mu);font-size:13px}.fl input{background:none;border:0;color:var(--ink);font:inherit;padding:0}.fl input:focus{outline:0}.fl input[type=date],.fl input[type=time]{width:auto}
.amw{font:700 20px Sora;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.np{background:var(--c1);border-radius:22px 22px 0 0;padding:10px 10px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);margin-top:auto}.cd{text-align:right;color:var(--mu);font:700 13px Sora;min-height:20px;padding:0 6px 6px}
.ng{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:8px}.ng button{padding:12px 0;background:var(--c2);border-radius:14px;font:700 18px Sora;text-align:center}.ng .op{background:var(--c3);color:var(--inc)}.ng button:active{background:var(--c3)}
.done{width:100%;padding:13px;border-radius:14px;font-weight:800;color:#fff;text-align:center}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:456px;background:var(--c1);border:1px solid var(--ln);border-radius:30px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:5px 6px;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.4)}.nav.has-plus{grid-template-columns:1fr 1fr 68px 1fr 1fr}
.nav button{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:700;color:var(--mu);padding:5px 0;border-radius:18px;gap:2px}.nav span{font-size:18px}.nav .on{color:var(--ink);background:var(--c2)}
.nav .plus{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,var(--inc),#0052cc);color:#fff;font-size:28px;margin:-22px auto 0;justify-content:center;box-shadow:0 8px 20px rgba(41,121,255,.45);transform:rotate(45deg)}.nav .plus b{transform:rotate(-45deg);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:35}.ov.on{display:flex}
.box{width:100%;max-width:480px;max-height:85vh;overflow:auto;background:var(--c1);padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;border-top:1px solid var(--ln)}
.sh2{font:800 18px Sora;margin-bottom:12px}.lb{color:var(--mu);font-size:12px;display:block;margin:4px 0}
.f{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:9px}
.ok{width:100%;padding:13px;border-radius:14px;font-weight:800;font-size:15px;background:var(--acc);color:#fff;text-align:center}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.cg button{background:var(--c2);border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;font-weight:600}.cg span{display:block;font-size:22px}
.lr{display:flex;justify-content:space-between;padding:13px 4px;width:100%;border-top:1px solid var(--ln)}
#tt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-weight:700;font-size:13px;z-index:50;display:none;max-width:90%}#tt button{font-weight:800;margin-left:10px;color:var(--exp)}
#lk{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}#lk.on{display:flex}
.dots{display:flex;gap:12px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mu)}.dots .f1{background:var(--inc);border-color:var(--inc)}
.pad{display:grid;grid-template-columns:repeat(3,70px);gap:12px}.pad button{height:70px;border-radius:50%;background:var(--c1);font:700 22px Sora;text-align:center;border:1px solid var(--ln)}
</style>
</head>
<body>
<main id="v"></main>
<nav class="nav" id="nav"></nav>
<div class="pg" id="pg"></div>
<div class="ov" id="ov"></div>
<div id="tt"></div>
<div id="lk"><div style="font-size:36px">🔒</div><h1 style="font-size:22px">Wallet Manager</h1><div id="lm" style="color:var(--mu);font-size:13px">Enter passcode</div><div class="dots" id="dots"></div><div class="pad" id="pad"></div></div>
<script>
// ---------- SUPABASE ----------
const SB_URL='https://hgnrczmdmiuxxwynqbjg.supabase.co';
const SB_KEY='sb_publishable_2cp47NIT4mPiozzj9Yl-Lw_zdQiQ03u';
let sb=null,tried=0,user=null;
function getSB(){
  if(sb)return sb;
  if(window.supabase&&window.supabase.createClient){
    try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){console.error('Supabase init error:',e)}
    return sb;
  }
  if(!tried&&document.readyState==='complete'){ // backup CDN if first one failed
    tried=1;const s=document.createElement('script');
    s.src='https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js';document.head.appendChild(s);
  }
  return null;
}

// ---------- HELPERS ----------
const $=q=>document.querySelector(q),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),R0=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
const pd=n=>String(n).padStart(2,'0'),ym=d=>d.getFullYear()+'-'+pd(d.getMonth()+1),iso=d=>ym(d)+'-'+pd(d.getDate()),hm=d=>pd(d.getHours())+':'+pd(d.getMinutes());
const DC={inc:[['Salary','💼'],['Pocket Money','💸'],['Freelance','💻'],['Scholarship','🎓'],['Gift','🎁'],['Other','💰']],exp:[['Food','🍜'],['Transport','🚌'],['Shopping','🛍️'],['Study','📚'],['Hostel / Rent','🏠'],['Recharge','📱'],['Fun','🎮'],['Health','💊'],['Social Life','👫'],['Other','✨']]};
const GR=['Cash','Accounts','Card','Debit Card','Savings','Top-Up/Prepaid','Investments','Others'];
const COL=['#2979ff','#ff3b56','#8c7ae6','#ffc247','#00d2d3','#ff9f43','#54a0ff','#10ac84'];
const seed=()=>({acc:[{id:'a1',name:'Cash in Hand',g:'Cash',open:0},{id:'a2',name:'UPI / Bank',g:'Accounts',open:0}],cats:JSON.parse(JSON.stringify(DC)),tx:[]});
const clean=r=>{const d=seed();if(!r||typeof r!=='object')return d;return{acc:Array.isArray(r.acc)&&r.acc.length?r.acc:d.acc,cats:r.cats&&r.cats.inc&&r.cats.exp?r.cats:d.cats,tx:Array.isArray(r.tx)?r.tx:[]}};
let S;try{S=clean(JSON.parse(localStorage.getItem('gz2')))}catch(e){S=seed()}
let PIN=localStorage.getItem('gz_pin')||'';
let tab='h',off=0,st='exp',per='m',A=null,ex='',fresh=0,undo=null;

const bal=a=>S.tx.reduce((s,t)=>s+(t.type==='inc'&&t.acc===a.id?t.amt:t.type==='exp'&&t.acc===a.id?-t.amt:t.type==='trf'?(t.to===a.id?t.amt:0)-(t.acc===a.id?t.amt:0):0),a.open||0);
const accN=id=>(S.acc.find(a=>a.id===id)||{name:'?'}).name;
const ce=(ty,n)=>((S.cats[ty]||[]).find(c=>c[0]===n)||[0,'✨'])[1];
const sum=(L,ty)=>L.filter(t=>t.type===ty).reduce((s,t)=>s+t.amt,0);
const mdate=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return d};
const sortT=L=>L.slice().sort((a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||'')));
const lbl=x=>{const y=new Date();y.setDate(y.getDate()-1);return x===iso(new Date())?'Today':x===iso(y)?'Yesterday':new Date(x+'T00:00').toLocaleString('en-US',{weekday:'short',day:'numeric',month:'short'})};
const mbar=d=>`<div class="mn"><button data-o="-1" aria-label="Previous month">‹</button><b>${d.toLocaleString('en-US',{month:'short',year:'numeric'})}</b><button data-o="1" aria-label="Next month">›</button></div>`;
function toast(m,u){const t=$('#tt');t.innerHTML=esc(m)+(u?'<button data-undo="1">Undo</button>':'');undo=u||null;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',u?4500:2800)}

// ---------- CLOUD SYNC ----------
const stamp=()=>+localStorage.getItem('gz_mod')||0;
async function push(){
  const c=getSB();if(!c||!user)return false;
  const ts=Date.now();
  const{error}=await c.from('user_data').upsert({user_id:user.id,data:S,updated_at:new Date(ts).toISOString()});
  if(error){console.error(error);toast('Sync failed: '+error.message);return false}
  localStorage.setItem('gz_mod',ts);return true;
}
let tm;const sync=()=>{if(user){clearTimeout(tm);tm=setTimeout(push,400)}};
const save=()=>{try{localStorage.setItem('gz2',JSON.stringify(S));localStorage.setItem('gz_mod',Date.now())}catch(e){}sync()};
async function pull(){
  const c=getSB();if(!c||!user)return;
  const{data,error}=await c.from('user_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();
  if(error){console.error(error);return toast('Cloud load failed: '+error.message)}
  const ct=data?new Date(data.updated_at).getTime():0;
  if(!data||!data.data||!data.data.acc||stamp()>ct)await push();
  else{S=clean(data.data);localStorage.setItem('gz2',JSON.stringify(S));localStorage.setItem('gz_mod',ct);render();toast('Cloud synced ✓')}
}

// ---------- RENDER ----------
const row=t=>{const tr=t.type==='trf',c=t.type==='inc'?'i':tr?'t':'e',sg=t.type==='inc'?'+':tr?'⇄ ':'−';
  return`<button class="r" data-e="${t.id}"><div class="ic">${tr?'🔁':ce(t.type,t.cat)}</div><div><b>${tr?'Transfer':esc(t.cat)}</b><small>${esc(t.note)||esc(accN(t.acc))}${tr?' → '+esc(accN(t.to)):''}</small></div><span class="num ${c}">${sg}${R0(t.amt)}</span></button>`};

function render(){
  const d=mdate(),k=ym(d),L=S.tx.filter(t=>t.date&&t.date.startsWith(k)),inc=sum(L,'inc'),exp=sum(L,'exp');let h='';
  const items=[['h','📖','Trans.'],['s','📊','Stats'],['a','👛','Accounts'],['m','⚙️','More']];
  $('#nav').className='nav'+(tab==='h'?' has-plus':'');
  $('#nav').innerHTML=items.map(([i,e,n],x)=>(tab==='h'&&x===2?'<button class="plus" data-add="1" aria-label="Add record"><b>+</b></button>':'')+`<button data-t="${i}" class="${tab===i?'on':''}"><span>${e}</span>${n}</button>`).join('');

  if(tab==='h'){
    const tot=S.acc.reduce((s,a)=>s+bal(a),0),hr=new Date().getHours();
    h=`<div class="top"><div><small>${hr<12?'Good morning':hr<18?'Good afternoon':'Good evening'} 👋</small><h1>Wallet Manager</h1></div><button class="btn ${user?'sy':''}" data-x="auth">${user?'👤 Sync On':'☁️ Cloud'}</button></div>
    <div class="hero"><small>Total Balance</small><div class="big">${R(tot)}</div><div class="chips"><span>Earned <i class="i">${R0(inc)}</i></span><span>Spent <i class="e">${R0(exp)}</i></span></div></div>
    <div class="bar2">${mbar(d)}</div>`;
    const ds=[...new Set(L.map(t=>t.date))].sort().reverse();
    h+=ds.length?ds.map(x=>{const q=sortT(L.filter(t=>t.date===x)),n=sum(q,'inc')-sum(q,'exp');return`<div class="day"><div class="dh"><span>${lbl(x)}</span><span class="${n<0?'e':'i'}">${n<0?'−':'+'}${R0(Math.abs(n))}</span></div>${q.map(row).join('')}</div>`}).join(''):'<div class="empty">No records this month.<br>Tap + to add one.</div>';
  }

  if(tab==='s'){
    let F=S.tx;
    if(per==='w'){const w=new Date();w.setDate(w.getDate()-6);const wi=iso(w);F=F.filter(t=>t.date>=wi)}
    else if(per==='y')F=F.filter(t=>t.date&&t.date.startsWith(String(d.getFullYear())));
    else F=F.filter(t=>t.date&&t.date.startsWith(k));
    const map={};F.filter(t=>t.type===st).forEach(t=>map[t.cat]=(map[t.cat]||0)+t.amt);
    const es=Object.entries(map).sort((a,b)=>b[1]-a[1]),tot=es.reduce((s,e)=>s+e[1],0),C=2*Math.PI*74;let a=0,arcs='';
    es.forEach(([c,v],i)=>{const l=v/tot*C;arcs+=`<circle r="74" cx="100" cy="100" fill="none" stroke="${COL[i%8]}" stroke-width="24" stroke-dasharray="${Math.max(l-3,1)} ${C}" stroke-dashoffset="${-a}" transform="rotate(-90 100 100)"/>`;a+=l});
    const days=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-6+i);return[x.toLocaleString('en-US',{weekday:'narrow'}),sum(S.tx.filter(t=>t.date===iso(x)),'exp')]}),mx=Math.max(...days.map(x=>x[1]),1);
