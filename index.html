<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wallet Manager</title>
<meta name="theme-color" content="#0e0f14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23121524'/%3E%3Crect x='16' y='30' width='68' height='50' rx='14' fill='%231b2034' stroke='%232979ff' stroke-width='4'/%3E%3Ccircle cx='75' cy='55' r='5' fill='%23ff3b56'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#0e0f14;--c1:#151822;--c2:#1e2333;--c3:#2a3148;
 --ink:#f5f6fb;--mu:#8a91a8;--ln:#24283b;
 --inc:#2979ff;--exp:#ff3b56;--trf:#8c7ae6;--acc:#2979ff;
 color-scheme:dark
}
@media(prefers-color-scheme:light){
:root:not([data-theme=dark]){
 --bg:#f2f4fa;--c1:#fff;--c2:#e8ecf6;--c3:#dbe1f2;
 --ink:#111420;--mu:#6a728a;--ln:#dce1ef;
 --inc:#1976d2;--exp:#e53935;--trf:#7b1fa2;--acc:#1976d2;color-scheme:light
}}
:root[data-theme=light{
 --bg:#f2f4fa;--c1:#fff;--c2:#e8ecf6;--c3:#dbe1f2;
 --ink:#111420;--mu:#6a728a;--ln:#dce1ef;
 --inc:#1976d2;--exp:#e53935;--trf:#7b1fa2;--acc:#1976d2;color-scheme:light
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
 background:var(--bg);color:var(--ink);
 font:500 14px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;
 min-height:100vh;overflow-x:hidden
}
h1,h2,.big,.num{font-family:Sora,'Plus Jakarta Sans',sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

main{max-width:480px;margin:auto;padding:14px 14px 110px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.top small{color:var(--mu);font-size:11.5px;font-weight:600}
.top h1{font-size:21px;font-weight:800;margin-top:2px}
.avatar{
 width:42px;height:42px;border-radius:50%;
 background:linear-gradient(135deg,var(--inc),#7357ff);
 color:#fff;display:grid;place-items:center;
 font:800 14px Sora;border:2px solid var(--c1);
 box-shadow:0 4px 15px rgba(41,121,255,.25)
}
.avatar:active{transform:scale(.94)}

.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.sumcard{
 background:var(--c1);border:1px solid var(--ln);
 border-radius:18px;padding:13px 14px
}
.sumcard.total{grid-column:1/-1;padding:16px}
.sumcard small{display:block;color:var(--mu);font-size:11px;font-weight:700;margin-bottom:5px}
.sumcard b{font:800 18px Sora}
.sumcard.total b{font-size:26px}
.sumcard .income{color:var(--inc)}
.sumcard .expense{color:var(--exp)}

.bar2{margin:8px 0 12px;display:flex;justify-content:center}
.mn{
 display:inline-flex;align-items:center;background:var(--c1);
 border-radius:99px;padding:2px;border:1px solid var(--ln)
}
.mn button{width:30px;height:30px;font-size:18px;text-align:center}
.mn b{min-width:100px;text-align:center;font-size:12.5px}

.day{
 background:var(--c1);border-radius:18px;padding:4px 14px;
 margin-bottom:10px;border:1px solid var(--ln)
}
.dh{
 display:flex;justify-content:space-between;padding:9px 0 5px;
 color:var(--mu);font-size:12px;font-weight:700
}
.r{
 display:grid;grid-template-columns:40px 1fr auto;gap:11px;
 align-items:center;width:100%;padding:10px 0
}
.r+.r{border-top:1px solid var(--ln)}
.ic{
 width:40px;height:40px;border-radius:14px;background:var(--c2);
 display:grid;place-items:center;font-size:18px
}
.r b{font-size:13px}
.r small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
.num{font-weight:700;font-size:14px;white-space:nowrap}
.i{color:var(--inc)}.e{color:var(--exp)}.t{color:var(--trf)}
.empty{text-align:center;color:var(--mu);padding:45px 10px;font-size:13px}

.card{
 background:var(--c1);border-radius:20px;padding:16px;
 margin-bottom:10px;border:1px solid var(--ln)
}
.card h2{font-size:14px;margin-bottom:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.grid3>div{
 background:var(--c1);border-radius:16px;padding:10px;
 border:1px solid var(--ln)
}
.grid3 small{display:block;color:var(--mu);font-size:10px;margin-bottom:4px}
.grid3 b{font:700 12px Sora}

.sg{
 display:flex;background:var(--c1);border-radius:99px;
 padding:2px;border:1px solid var(--ln)
}
.sg button{
 flex:1;padding:7px 10px;border-radius:99px;
 font-size:11.5px;font-weight:700;color:var(--mu)
}
.sg .on{background:var(--c2);color:var(--ink)}

.ring{display:block;margin:4px auto 10px;width:190px;height:190px}
.lg{
 display:grid;grid-template-columns:10px 1fr auto;
 gap:10px;align-items:center;padding:8px 0
}
.lg i{width:10px;height:10px;border-radius:3px}
.lg .bt{grid-column:2/4;height:5px;border-radius:4px;background:var(--c2);overflow:hidden}
.lg .bt u{display:block;height:100%}
.wk{display:flex;align-items:flex-end;gap:6px;height:95px}
.wk div{
 flex:1;height:100%;display:flex;flex-direction:column;
 justify-content:flex-end;align-items:center;gap:4px;
 font-size:10px;color:var(--mu)
}
.wk i{width:100%;border-radius:6px;background:var(--exp);min-height:4px}

.acc{
 width:100%;background:var(--c1);border:1px solid var(--ln);
 border-radius:18px;padding:12px 14px;margin-bottom:8px;
 display:flex;justify-content:space-between;align-items:center
}
.acl{display:flex;align-items:center;gap:10px}
.aci{
 width:38px;height:38px;border-radius:13px;background:var(--c2);
 display:grid;place-items:center;font-size:18px
}
.acc small{color:var(--mu);font-size:11px}

.more{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mi{
 background:var(--c1);border:1px solid var(--ln);border-radius:18px;
 padding:16px 7px;display:flex;flex-direction:column;
 align-items:center;text-align:center;gap:8px
}
.mi:active{transform:scale(.97)}
.mic{
 width:42px;height:42px;border-radius:14px;background:var(--c2);
 display:grid;place-items:center;font-size:20px
}
.mi span{font-size:11.5px;font-weight:700}
.foot{text-align:center;margin:28px 0 8px;color:var(--mu);font-size:11px;line-height:1.6}

.nav{
 position:fixed;left:50%;transform:translateX(-50%);
 bottom:calc(10px + env(safe-area-inset-bottom,0px));
 width:calc(100% - 24px);max-width:456px;
 background:var(--c1);border:1px solid var(--ln);
 border-radius:30px;display:grid;grid-template-columns:repeat(4,1fr);
 align-items:center;padding:5px 6px;z-index:10;
 box-shadow:0 10px 30px rgba(0,0,0,.35)
}
.nav button{
 display:flex;flex-direction:column;align-items:center;
 font-size:10px;font-weight:700;color:var(--mu);
 padding:6px 0;border-radius:18px;gap:2px
}
.nav span{font-size:18px}
.nav .on{color:var(--ink);background:var(--c2)}

.pg{
 position:fixed;inset:0;background:var(--bg);z-index:25;
 display:none;flex-direction:column;overflow:hidden
}
.pg.on{display:flex}
.pg .in{
 max-width:480px;width:100%;margin:auto;flex:1;
 display:flex;flex-direction:column;padding:10px 14px;overflow-y:auto
}
.ph{display:flex;align-items:center;gap:10px;padding:4px 0 10px}
.ph h2{flex:1;font-size:18px}
.ph button{
 width:38px;height:38px;border-radius:12px;
 background:var(--c1);text-align:center;border:1px solid var(--ln)
}
.tp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tp button{
 padding:10px;border-radius:14px;background:var(--c1);
 font-weight:700;text-align:center;border:2px solid transparent;font-size:13px
}
.fl{
 display:grid;grid-template-columns:85px 1fr;align-items:center;
 padding:11px 4px;border-bottom:1px solid var(--ln);width:100%
}
.fl label{color:var(--mu);font-size:13px}
.fl input{background:none;border:0;color:var(--ink);padding:0}
.fl input:focus{outline:0}
.amw{font:700 20px Sora;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.np{
 background:var(--c1);border-radius:22px 22px 0 0;
 padding:10px 10px calc(12px + env(safe-area-inset-bottom,0px));
 border-top:1px solid var(--ln);margin-top:auto
}
.cd{text-align:right;color:var(--mu);font:700 13px Sora;min-height:20px;padding:0 6px 6px}
.ng{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:8px}
.ng button{
 padding:12px 0;background:var(--c2);border-radius:14px;
 font:700 18px Sora;text-align:center
}
.ng .op{background:var(--c3);color:var(--inc)}
.done{
 width:100%;padding:13px;border-radius:14px;
 font-weight:800;color:#fff;text-align:center
}

.ov{
 position:fixed;inset:0;background:rgba(0,0,0,.72);
 display:none;align-items:flex-end;justify-content:center;z-index:35
}
.ov.on{display:flex}
.box{
 width:100%;max-width:480px;max-height:88vh;overflow:auto;
 background:var(--c1);padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));
 border-radius:26px 26px 0 0;border-top:1px solid var(--ln)
}
.sh2{font:800 18px Sora;margin-bottom:12px}
.lb{color:var(--mu);font-size:12px;display:block;margin:5px 0}
.f{
 width:100%;padding:12px 14px;border-radius:14px;
 border:1px solid var(--ln);background:var(--bg);
 color:var(--ink);margin-bottom:9px
}
textarea.f{min-height:120px;resize:vertical}
.ok{
 width:100%;padding:13px;border-radius:14px;
 font-weight:800;font-size:14px;background:var(--acc);
 color:#fff;text-align:center
}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.cg button{
 background:var(--c2);border-radius:14px;padding:10px 4px;
 text-align:center;font-size:12px;font-weight:600
}
.cg span{display:block;font-size:22px}
.lr{
 display:flex;justify-content:space-between;
 padding:13px 4px;width:100%;border-top:1px solid var(--ln)
}

#tt{
 position:fixed;left:50%;transform:translateX(-50%);
 bottom:calc(90px + env(safe-area-inset-bottom,0px));
 background:var(--ink);color:var(--bg);padding:9px 16px;
 border-radius:12px;font-weight:700;font-size:13px;
 z-index:70;display:none;max-width:90%
}
#tt button{font-weight:800;margin-left:10px;color:var(--exp)}

#lk{
 position:fixed;inset:0;background:var(--bg);z-index:90;
 display:none;flex-direction:column;align-items:center;
 justify-content:center;gap:16px
}
#lk.on{display:flex}
.dots{display:flex;gap:12px}
.dots i{
 width:14px;height:14px;border-radius:50%;
 border:2px solid var(--mu)
}
.dots .f1{background:var(--inc);border-color:var(--inc)}
.pad{display:grid;grid-template-columns:repeat(3,70px);gap:12px}
.pad button{
 height:70px;border-radius:50%;background:var(--c1);
 font:700 22px Sora;text-align:center;border:1px solid var(--ln)
}

/* SPLASH */
#splash{
 position:fixed;inset:0;background:var(--bg);z-index:100;
 display:flex;align-items:center;justify-content:center;
 transition:opacity .45s ease,visibility .45s ease
}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splashLogo{
 width:82px;height:82px;border-radius:25px;
 background:linear-gradient(135deg,#2979ff,#7357ff);
 display:grid;place-items:center;color:#fff;
 font:800 30px Sora;
 box-shadow:0 15px 45px rgba(41,121,255,.35);
 animation:splashPulse 1.2s ease-in-out infinite
}
.splashText{
 position:absolute;margin-top:150px;
 font:800 18px Sora;letter-spacing:-.5px
}
@keyframes splashPulse{
 0%,100%{transform:scale(.94);opacity:.85}
 50%{transform:scale(1);opacity:1}
}

/* AUTH */
#authGate{
 position:fixed;inset:0;background:var(--bg);z-index:80;
 display:none;overflow:auto
}
#authGate.on{display:block}
.authWrap{
 min-height:100%;max-width:480px;margin:auto;
 padding:45px 20px 30px;display:flex;
 flex-direction:column;justify-content:center
}
.authLogo{
 width:70px;height:70px;border-radius:22px;
 background:linear-gradient(135deg,#2979ff,#7357ff);
 display:grid;place-items:center;color:#fff;
 font:800 24px Sora;margin:0 auto 18px
}
.authWrap h1{text-align:center;font:800 24px Sora}
.authWrap .sub{
 color:var(--mu);text-align:center;font-size:12.5px;
 margin:8px 0 25px
}
.authCard{
 background:var(--c1);border:1px solid var(--ln);
 border-radius:24px;padding:18px
}
.authCard .ok{margin-top:4px}
.authSwitch{
 margin-top:16px;text-align:center;color:var(--mu);font-size:12px
}
.authSwitch button{color:var(--inc);font-weight:800}
.authMsg{
 color:var(--mu);font-size:11.5px;text-align:center;
 margin-top:12px;line-height:1.5
}
</style>
</head>

<body>

<div id="splash">
  <div class="splashLogo">₹</div>
  <div class="splashText">Wallet Manager</div>
</div>

<div id="authGate">
  <div class="authWrap">
    <div class="authLogo">₹</div>
    <h1 id="authTitle">Welcome back</h1>
    <div class="sub" id="authSub">Sign in to access your Wallet Manager</div>

    <div class="authCard">
      <input class="f" type="email" id="gateEmail" placeholder="Email address" autocomplete="email">
      <input class="f" type="password" id="gatePassword" placeholder="Password" autocomplete="current-password">

      <button class="ok" id="gateBtn">Log In</button>

      <div class="authSwitch">
        <span id="switchText">Don't have an account?</span>
        <button id="switchAuth">Sign Up</button>
      </div>

      <div class="authMsg" id="authMsg">
        Your data can sync across your devices after signing in.

  </div>
</div>

<main id="v"></main>
<nav class="nav" id="nav"></nav>
<div class="pg" id="pg"></div>
<div class="ov" id="ov"></div>
<div id="tt"></div>

<div id="lk">
  <div style="font-size:36px">🔒</div>
  <h1 style="font-size:22px">Wallet Manager</h1>
  <div id="lm" style="color:var(--mu);font-size:13px">Enter passcode</div>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
</div>

<script>
/* =========================
   SUPABASE
========================= */
const SB_URL='https://hgnrczmdmiuxxwynqbjg.supabase.co';
const SB_KEY='sb_publishable_2cp47NIT4mPiozzj9Yl-Lw_zdQiQ03u';

let sb=null,tried=0,user=null;

function getSB(){
  if(sb)return sb;
  if(window.supabase&&window.supabase.createClient){
    try{
      sb=window.supabase.createClient(SB_URL,SB_KEY);
    }catch(e){console.error(e)}
    return sb;
  }
  if(!tried&&document.readyState==='complete'){
    tried=1;
    const s=document.createElement('script');
    s.src='https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js';
    document.head.appendChild(s);
  }
  return null;
}

/* =========================
   HELPERS
========================= */
const $=q=>document.querySelector(q);
const uid=()=>Math.random().toString(36).slice(2,9);

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'
}[c]));

const R=n=>'₹'+Number(n||0).toLocaleString('en-IN',{
 minimumFractionDigits:2,maximumFractionDigits:2
});

const R0=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');

const pd=n=>String(n).padStart(2,'0');
const ym=d=>d.getFullYear()+'-'+pd(d.getMonth()+1);
const iso=d=>ym(d)+'-'+pd(d.getDate());
const hm=d=>pd(d.getHours())+':'+pd(d.getMinutes());

const DC={
 inc:[
  ['Salary','💼'],['Pocket Money','💸'],['Freelance','💻'],
  ['Scholarship','🎓'],['Gift','🎁'],['Other','💰']
 ],
 exp:[
  ['Food','🍜'],['Transport','🚌'],['Shopping','🛍️'],
  ['Study','📚'],['Hostel / Rent','🏠'],['Recharge','📱'],
  ['Fun','🎮'],['Health','💊'],['Social Life','👫'],['Other','✨']
 ]
};

const GR=[
 'Cash','Accounts','Card','Debit Card','Savings',
 'Top-Up/Prepaid','Investments','Others'
];

const COL=[
 '#2979ff','#ff3b56','#8c7ae6','#ffc247',
 '#00d2d3','#ff9f43','#54a0ff','#10ac84'
];

const seed=()=>({
 acc:[
  {id:'a1',name:'Cash in Hand',g:'Cash',open:0},
  {id:'a2',name:'UPI / Bank',g:'Accounts',open:0}
 ],
 cats:JSON.parse(JSON.stringify(DC)),
 tx:[]
});

const clean=r=>{
 const d=seed();
 if(!r||typeof r!=='object')return d;
 return{
  acc:Array.isArray(r.acc)&&r.acc.length?r.acc:d.acc,
  cats:r.cats&&r.cats.inc&&r.cats.exp?r.cats:d.cats,
  tx:Array.isArray(r.tx)?r.tx:[]
 };
};

let S;
try{
 S=clean(JSON.parse(localStorage.getItem('gz2')))
}catch(e){
 S=seed()
}

let PIN=localStorage.getItem('gz_pin')||'';

let tab='h';
let off=0;
let st='exp';
let per='m';
let A=null;
let ex='';
let fresh=0;
let undo=null;
let bootReady=false;
let authMode='login';

const bal=a=>S.tx.reduce((s,t)=>
 s+
 (t.type==='inc'&&t.acc===a.id?t.amt:
  t.type==='exp'&&t.acc===a.id?-t.amt:
  t.type==='trf'?
   (t.to===a.id?t.amt:0)-(t.acc===a.id?t.amt:0):0),
 a.open||0);

const accN=id=>(S.acc.find(a=>a.id===id)||{name:'?' }).name;

const ce=(ty,n)=>
 ((S.cats[ty]||[]).find(c=>c[0]===n)||[0,'✨'])[1];

const sum=(L,ty)=>L.filter(t=>t.type===ty)
 .reduce((s,t)=>s+Number(t.amt||0),0);

const mdate=()=>{
 const d=new Date();
 d.setDate(1);
 d.setMonth(d.getMonth()+off);
 return d
};

const sortT=L=>L.slice().sort((a,b)=>
 ((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||''))
);

const lbl=x=>{
 const y=new Date();
 y.setDate(y.getDate()-1);
 return x===iso(new Date())?'Today':
 x===iso(y)?'Yesterday':
 new Date(x+'T00:00').toLocaleString('en-US',{
  weekday:'short',day:'numeric',month:'short'
 });
};

const mbar=d=>`
<div class="mn">
 <button data-o="-1">‹</button>
 <b>${d.toLocaleString('en-US',{month:'short',year:'numeric'})}</b>
 <button data-o="1">›</button>
</div>`;

function toast(m,u){
 const t=$('#tt');
 t.innerHTML=esc(m)+(u?'<button data-undo="1">Undo</button>':'');
 undo=u||null;
 t.style.display='block';
 clearTimeout(t._t);
 t._t=setTimeout(()=>t.style.display='none',u?4500:2800);
}

/* =========================
   CLOUD SYNC
========================= */

const stamp=()=>+localStorage.getItem('gz_mod')||0;

async function push(){
 const c=getSB();
 if(!c||!user)return false;

 const ts=Date.now();

 const{error}=await c.from('user_data').upsert({
  user_id:user.id,
  data:S,
  updated_at:new Date(ts).toISOString()
 });

 if(error){
  console.error(error);
  toast('Sync failed: '+error.message);
  return false
 }

 localStorage.setItem('gz_mod',ts);
 return true;
}

let tm;

const sync=()=>{
 if(user){
  clearTimeout(tm);
  tm=setTimeout(push,400)
 }
};

const save=()=>{
 try{
  localStorage.setItem('gz2',JSON.stringify(S));
  localStorage.setItem('gz_mod',Date.now());
 }catch(e){}
 sync();
};

async function pull(){
 const c=getSB();
 if(!c||!user)return;

 const{data,error}=await c.from('user_data')
  .select('data,updated_at')
  .eq('user_id',user.id)
  .maybeSingle();

 if(error){
  console.error(error);
  toast('Cloud load failed: '+error.message);
  return
 }

 const ct=data?new Date(data.updated_at).getTime():0;

 if(!data||!data.data||!data.data.acc||stamp()>ct){
  await push();
 }else{
  S=clean(data.data);
  localStorage.setItem('gz2',JSON.stringify(S));
  localStorage.setItem('gz_mod',ct);
  render();
 }

function ev(s){
 const t=s.match(/\d*\.?\d+|[-+*\/]/g)||[];

 while(t.length&&/^[-+*\/]$/.test(t[t.length-1]))t.pop();
 if(!t.length)return 0;

 const n=[+t[0]],o=[];

 for(let i=1;i<t.length;i+=2){
  const op=t[i],v=+t[i+1];

  if(op==='*')n[n.length-1]*=v;
  else if(op==='/')n[n.length-1]=v?n[n.length-1]/v:NaN;
  else{
   o.push(op);
   n.push(v)
  }
 }

 return n.reduce((s,v,i)=>
  i?(o[i-1]==='+'?s+v:s-v):s
 );
}

const amt=()=>{
 const v=ev(ex);
 return isFinite(v)?Math.round(v*100)/100:0
};

const hasOp=()=>/[-+*\/]/.test(ex);

const updDisp=()=>{
 const a=$('#da'),c=$('#cd');
 if(a)a.textContent=
  ex.replace(/\*/g,'×')
    .replace(/\//g,'÷')
    .replace(/-/g,'−')||'0';

 if(c)c.textContent=hasOp()?'= '+R(amt()):'';
};

function key(k){
 if(k==='done'){
  const v=amt();

  if(!(v>0))return toast('Enter an amount');

  if(A.type!=='trf'&&!A.cat)return pick('cat');

  return saveTx(v);
 }

 const last=ex.split(/[-+*\/]/).pop();

 if(k==='⌫')ex=ex.slice(0,-1);

 else if(/^[-+*\/]$/.test(k)){
  if(!ex)return;
  ex=/[-+*\/]$/.test(ex)?
   ex.slice(0,-1)+k:ex+k
 }

 else if(k==='.'){
  if(last.includes('.'))return;
  ex+=last?'.':'0.'
 }

 else{
  if(last.includes('.')&&last.split('.')[1].length>=2)return;
  if(last.length>=8)return;
  ex=(last==='0'?ex.slice(0,-1):ex)+k
 }

 updDisp();
}

function saveTx(n){
 if(A.type==='trf'&&A.acc===A.to)
  return toast('Select two different accounts');

 const r={
  id:A.id||uid(),
  type:A.type,
  cat:A.type==='trf'?'':A.cat,
  amt:n,
  note:(A.note||'').trim(),
  acc:A.acc,
  to:A.type==='trf'?A.to:'',
  date:A.date||iso(new Date()),
  time:A.time||''
 };

 S.tx=S.tx.filter(x=>x.id!==r.id).concat(r);

 save();

 $('#pg').classList.remove('on');
 render();
 toast('Saved ✓');
}

 const c=getSB();

 if(!c)return toast('Cloud is still loading, try again');
 if(!em||!pw)return toast('Enter email & password');

 try{
  const r=type==='login'?
   await c.auth.signInWithPassword({
    email:em,password:pw
   }):
   await c.auth.signUp({
    email:em,password:pw

  if(r.error)throw r.error;

  closeSheet();

  if(r.data.session){
   user=r.data.user;

   $('#authGate').classList.remove('on');
   toast(type==='login'?'Logged in ✓':'Account created ✓');

   a.open,
   '','','','','','','','',''
  ]);
 });

 Object.entries(S.cats).forEach(([type,list])=>{
  list.forEach(c=>{
   rows.push([
    'CATEGORY',
    '',
    c[0],
    '',
    '',
    type,
    c[1],
    '','','','','','',''
   ]);
  });
 });

 sortT(S.tx).forEach(t=>{
  rows.push([
   'TRANSACTION',
   t.id,
   '',
   '',
   '',
   t.type,
   '',
   t.date||'',
   t.time||'',
   t.cat||'',
   t.acc||'',
   t.to||'',
   t.amt||0,
   t.note||''
  ]);
 });

 return '\ufeff'+rows.map(r=>r.map(csvEscape).join(',')).join('\n');
}

/* CSV parser */
function parseCSV(text){
 const rows=[];
 let row=[];
 let cell='';
 let quote=false;

 for(let i=0;i<text.length;i++){
  const ch=text[i];

  if(ch==='"'){
   if(quote&&text[i+1]==='"'){
    cell+='"';
    i++;
   }else{
    quote=!quote;
   }
  }else if(ch===','&&!quote){
   row.push(cell);
   cell='';
  }else if((ch==='\n'||ch==='\r')&&!quote){
   if(ch==='\r'&&text[i+1]==='\n')i++;
   row.push(cell);
   if(row.some(x=>x!==''))rows.push(row);
   row=[];
   cell='';
  }else{
   cell+=ch;
  }
 }

 if(cell!==''||row.length){
  row.push(cell);
  if(row.some(x=>x!==''))rows.push(row);
 }

 return rows;
}

async function restoreBackup(file){
 try{
  const text=await file.text();

  /* Keep old JSON backups working */
  if(file.name.toLowerCase().endsWith('.json')){
   const j=JSON.parse(text);

   if(!(j.acc&&j.tx))throw new Error('Invalid backup');

   S=clean(j);
   save();
   closeSheet();
   render();
   toast('Backup restored ✓');
   return;
  }

  const rows=parseCSV(text);
  const accounts=[];
  const cats={
   inc:[],
   exp:[]
  };
  const tx=[];

  for(const r of rows){
   if(r[0]==='ACCOUNT'){
    accounts.push({
     id:r[1]||uid(),
     name:r[2]||'Account',
     g:r[3]||'Others',
     open:Number(r[4])||0
    });
   }

   if(r[0]==='CATEGORY'){
    const type=r[5];
    if(type==='inc'||type==='exp'){
     cats[type].push([
      r[2]||'Other',
      r[6]||'✨'
     ]);
    }
   }

   if(r[0]==='TRANSACTION'){
    tx.push({
     id:r[1]||uid(),
     type:r[5]||'exp',
     cat:r[9]||'',
     amt:Number(r[12])||0,
     note:r[13]||'',
     acc:r[10]||'',
     to:r[11]||'',
     date:r[7]||iso(new Date()),
     time:r[8]||''
    });
   }
  }

  if(!accounts.length)throw new Error('No accounts');

  S=clean({
   acc:accounts,
   cats:{
    inc:cats.inc.length?cats.inc:DC.inc,
    exp:cats.exp.length?cats.exp:DC.exp
   },
   tx
  });

  save();
  closeSheet();
  render();
  toast('Backup restored ✓');

 }catch(e){
  console.error(e);
  toast('Invalid backup file');
 }
}

function dl(name,text,type){
 const b=new Blob([text],{type});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(b);
 a.download=name;
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

async function xact(x,D){

 if(x==='auth'){
  authSheet();
 }

 else if(x==='new_acc'){
  accSheet();
 }

 else if(x==='delacc'){
  const id=D.id;

  if(S.acc.length<2)
   return toast('Keep at least one account');

  if(S.tx.some(t=>t.acc===id||t.to===id))
   return toast('This account has records. Delete them first');

  S.acc=S.acc.filter(a=>a.id!==id);

  save();
  closeSheet();
  render();
 }

 else if(x==='msync'){
  if(await push()){
   await pull();
   closeSheet();
   toast('Synced ✓');
  }
 }

 else if(x==='logout'){

  if(await push()!==true)
   return toast('Sync failed, so not logging out');

  const c=getSB();

  if(c)await c.auth.signOut();

  user=null;
  bootReady=false;

  S=seed();

  localStorage.removeItem('gz2');
  localStorage.removeItem('gz_mod');

  closeSheet();
  $('#authGate').classList.add('on');

  setAuthMode('login');
  toast('Logged out');
 }

 else if(x==='pin'){
  pinSheet();
 }

 else if(x==='theme'){
  const r=document.documentElement;

  const light=
   r.dataset.theme==='light'||
   (!r.dataset.theme&&matchMedia('(prefers-color-scheme:light)').matches);

  r.dataset.theme=light?'dark':'light';

  localStorage.setItem(
   'gz_theme',
   r.dataset.theme
  );

  render();
 }

 else if(x==='bk'){
  bkSheet();
 }

 else if(x==='bkdl'){
  downloadBackup();
 }

 else if(x==='feedback'){
  feedbackSheet();
 }

 else if(x==='about'){
  sheet(`
   <div class="sh2">About Wallet Manager</div>

   <p style="
    color:var(--mu);
    font-size:13px;
    line-height:1.7;

    Built with passion by KM.
   </div>

   <button type="button"
    class="ok"
    data-x="closesheet">
    Close
   </button>
  `);
 }

 else if(x==='closesheet'){
  closeSheet();
 }

 else if(x==='fresh'){
  if(fresh){
   S.tx=[];
   S.acc.forEach(a=>a.open=0);
   save();
   fresh=0;

   toast('All data cleared');

document.addEventListener('click',async e=>{

 if(e.target===$('#ov')){

 }

  [data-e],[data-ty],[data-a],[data-pc],
  [data-pa],[data-add],[data-x],[data-undo],
  [data-ea],[data-auth],[data-k]
 `);

 if(!c)return;

 const D=c.dataset;

 if(D.k!==undefined){
  key(D.k);
 }

 else if(D.auth){
  auth(
   D.auth,
   (($('#em')||{}).value||'').trim(),
   (($('#pw')||{}).value||'').trim()
  );
 }

 else if(D.per){
  per=D.per;
  render();
 }

 else if(D.t){
  tab=D.t;
  render();
  window.scrollTo(0,0);
 }

 else if(D.o){
  off=Math.min(0,off+ +D.o);
  render();
 }

 else if(D.st){
  st=D.st;
  render();
 }

 else if(D.add!==undefined){
  openAdd();
 }

 else if(D.e){
  const t=S.tx.find(t=>t.id===D.e);
  if(t)openAdd(t);
 }

 else if(D.ty){
  A.type=D.ty;

  if(!(S.cats[D.ty]||[]).find(x=>x[0]===A.cat))
   A.cat='';

  addR();
 }

 else if(D.a==='close'){
  $('#pg').classList.remove('on');
 }

 else if(D.a==='cat'||D.a==='acc'||D.a==='to'){
  pick(D.a);
 }

 else if(D.a==='del'){
  const t=S.tx.find(x=>x.id===A.id);

  S.tx=S.tx.filter(x=>x.id!==A.id);

  save();
  $('#pg').classList.remove('on');
  render();

  toast('Deleted',()=>{
   if(t){
    S.tx.push(t);
    save();
    render();
   }
  });
 }

 else if(D.pc){
  A.cat=D.pc;
  closeSheet();
  addR();
 }

 else if(D.pa){
  const[k,id]=D.pa.split(':');

  if(k==='to')A.to=id;
  else A.acc=id;

  closeSheet();
  addR();
 }

 else if(D.undo){
  if(undo)undo();
  $('#tt').style.display='none';
 }

 else if(D.ea){
  accSheet(D.ea);
 }

 else if(D.x){
  await xact(D.x,D);
 }
});

function setAuthMode(mode){
 authMode=mode;

 const title=$('#authTitle');
 const sub=$('#authSub');
 const btn=$('#gateBtn');
 const switchText=$('#switchText');
 const switchBtn=$('#switchAuth');

 if(mode==='login'){
  title.textContent='Welcome back';
  sub.textContent='Sign in to access your Wallet Manager';
  btn.textContent='Log In';
  switchText.textContent="Don't have an account?";
  switchBtn.textContent='Sign Up';
 }else{
  title.textContent='Create your account';
  sub.textContent='Create an account to sync your wallet data';
  btn.textContent='Sign Up';
  switchText.textContent='Already have an account?';
  switchBtn.textContent='Log In';
 }

 $('#authMsg').textContent=
  'Your data can sync across your devices after signing in.';
}

$('#switchAuth').onclick=()=>{
 setAuthMode(authMode==='login'?'signup':'login');
};

$('#gateBtn').onclick=async()=>{
 const em=$('#gateEmail').value.trim();
 const pw=$('#gatePassword').value.trim();

 if(!em||!pw)
  return toast('Enter email & password');

 const btn=$('#gateBtn');
 btn.disabled=true;
 btn.textContent='Please wait...';

 try{
  const c=getSB();

  if(!c)throw new Error('Cloud is still loading');

  const r=authMode==='login'?
   await c.auth.signInWithPassword({
    email:em,password:pw
   }):
   await c.auth.signUp({
    email:em,password:pw
   });

  if(r.error)throw r.error;

  if(r.data.session){
   user=r.data.user;
   bootReady=true;

   $('#authGate').classList.remove('on');

   await pull();
   render();

   toast(authMode==='login'?'Logged in ✓':'Account created ✓');
  }else{
   $('#authMsg').textContent=
    'Account created. Check your email if confirmation is required, then log in.';
   setAuthMode('login');
   $('#gatePassword').value='';
   toast('Account created ✓');
  }

 }catch(e){
  toast(e.message||'Authentication error');
 }finally{
  btn.disabled=false;
  btn.textContent=authMode==='login'?'Log In':'Sign Up';
 }
};

$('#gatePassword').addEventListener('keydown',e=>{
 if(e.key==='Enter')$('#gateBtn').click();
});

$('#gateEmail').addEventListener('keydown',e=>{
 if(e.key==='Enter')$('#gatePassword').focus();
});

/* =========================
   SESSION / STARTUP
========================= */

async function startApp(){

 const th=localStorage.getItem('gz_theme');

 if(th)
  document.documentElement.dataset.theme=th;

 /* Splash */
 await new Promise(resolve=>setTimeout(resolve,1100));

 const c=getSB();

 if(!c){
  setTimeout(startApp,500);
  return;
 }

 try{
  const{data}=await c.auth.getSession();

  if(data&&data.session){
   user=data.session.user;
   bootReady=true;

   $('#splash').classList.add('hide');
   $('#authGate').classList.remove('on');

   render();

   await pull();

   render();

   lock();

  }else{
   bootReady=false;

   $('#splash').classList.add('hide');
   $('#authGate').classList.add('on');

   setAuthMode('login');
  }

  c.auth.onAuthStateChange(async(_event,s)=>{
   user=s?s.user:null;

   if(user){
    bootReady=true;
    $('#authGate').classList.remove('on');
    render();
   }
  });

 }catch(e){
  console.error(e);

  $('#splash').classList.add('hide');
  $('#authGate').classList.add('on');
  setAuthMode('login');
 }
}

startApp();
