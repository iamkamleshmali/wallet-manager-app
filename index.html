<style>

.pg .in{max-width:480px;width:100%;margin:0 auto;flex:1;padding:12px 16px}
.ph{display:flex;align-items:center;gap:12px;padding:6px 0 14px}.ph h2{flex:1;font-size:20px}.ph button{width:42px;height:42px;border-radius:14px;background:var(--c1);font-size:18px;text-align:center}
.tp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.tp button{padding:12px;border-radius:16px;background:var(--c1);font-weight:700;text-align:center;border:2px solid transparent}
.fl{display:grid;grid-template-columns:96px 1fr;align-items:center;padding:14px 4px;border-bottom:1px solid var(--ln);width:100%}

.fl .v{display:flex;gap:10px}
.amw{display:flex;align-items:center;gap:4px}.amw span,.amtv{font:800 32px Sora;letter-spacing:-1px}.fl input.amtv{width:100%;color:inherit}
.kp{position:sticky;bottom:0;background:var(--c1);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));max-width:480px;width:100%;margin:0 auto;border-radius:24px 24px 0 0}
.pg.typing .kp{display:none}
.kp button{padding:15px 0;border-radius:16px;background:var(--c2);font:700 22px Sora;text-align:center}.kp .dn{grid-column:span 3;background:var(--acc);color:var(--on);font-size:17px}
.sv{position:sticky;bottom:0;background:var(--bg);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));max-width:480px;width:100%;margin:0 auto}
#tt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:40;display:none;max-width:90%}
#tt button{font-weight:800;margin-left:12px;color:var(--exp)}
#lk{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px}#lk.on{display:flex}
.dots{display:flex;gap:14px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mu)}.dots .f1{background:var(--acc);border-color:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px}.pad button{height:74px;border-radius:50%;background:var(--c1);font:700 24px Sora;text-align:center}
</style>
</head>
<body>
<main id="v"></main>
<nav class="nav" id="nav"></nav>
<div class="pg" id="pg"></div>
<div class="ov" id="ov"></div><div id="tt"></div>
<div id="lk"><h1>Wallet Manager</h1><div id="lm" style="color:var(--mu)">Enter passcode</div><div class="dots" id="dots"></div><div class="pad" id="pad"></div></div>

<script>
// --- SUPABASE CONFIG ---
const SB_URL = 'https://hgnrczmdmiuxxwynqbjg.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnbnJjem1kbWl1eHh3eW5xYmpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NzI2ODYsImV4cCI6MjEwNjI0ODY4Nn0.xv0e7ugwzESvHoUD4MJAcDxqTfFxQoKGPeMnmV6JUXs';

let supabase = null;
function getSB(){
  if(!supabase && window.supabase && typeof window.supabase.createClient === 'function'){
    try {
      supabase = window.supabase.createClient(SB_URL, SB_KEY);
    } catch(e) {
      console.warn('Supabase client error:', e);
    }
  }
  return supabase;
}

let currentUser = null;

const DC={exp:[['Food','🍜'],['Transport','🚌'],['Shopping','🛍️'],['Study','📚'],['Hostel / Rent','🏠'],['Recharge','📱'],['Fun','🎮'],['Health','💊'],['Social Life','👫'],['Other','✨']],inc:[['Pocket Money','💸'],['Salary','💼'],['Freelance','💻'],['Scholarship','🎓'],['Gift','🎁'],['Other','💰']]};
const GR=['Cash','Accounts','Card','Debit Card','Savings','Top-Up/Prepaid','Investments','Overdrafts','Loan','Insurance','Others'];
const COL=['#b6ff5c','#ff5c93','#5cc8ff','#ffc247','#a78bfa','#4ddbb0','#ff8a4d','#9aa3b5','#f472b6','#7c8cff'];
const $=q=>document.querySelector(q),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m2=n=>Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),R=n=>'₹'+m2(n),R0=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
const pad=n=>String(n).padStart(2,'0'),ym=d=>d.getFullYear()+'-'+pad(d.getMonth()+1),iso=d=>ym(d)+'-'+pad(d.getDate()),hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
let S,tab='h',view='l',off=0,st='exp',mode='',sel='',A=null,undo=null,fresh=0;

function seed(){
  return {
    acc:[{id:'a1',name:'Cash in Hand',g:'Cash',open:0},{id:'a2',name:'UPI / Bank',g:'Accounts',open:0}],
    cats:JSON.parse(JSON.stringify(DC)),
    bud:{total:0,cat:{}},
    pin:'',
    tx:[]
  };
}

// Auto-repair data schema so it never crashes
function cleanState(raw){
  const def = seed();
  if(!raw || typeof raw !== 'object') return def;
  return {
    acc: Array.isArray(raw.acc) && raw.acc.length ? raw.acc : def.acc,
    cats: raw.cats && typeof raw.cats === 'object' ? raw.cats : def.cats,
    bud: raw.bud && typeof raw.bud === 'object' ? raw.bud : def.bud,
    pin: typeof raw.pin === 'string' ? raw.pin : '',
    tx: Array.isArray(raw.tx) ? raw.tx : []
  };
}

try {
  S = cleanState(JSON.parse(localStorage.getItem('gz2')));
} catch(e) {
  S = seed();
}

// --- CLOUD SYNC ---
let syncTimeout = null;
function syncToCloud(){
  const sb = getSB();
  if(!sb || !currentUser) return;
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(async ()=>{
    try{
      await sb.from('user_data').upsert({
        user_id: currentUser.id,
        data: JSON.parse(JSON.stringify(S)),
        updated_at: new Date().toISOString()
      });
    }catch(err){
      console.error('Cloud sync error:', err);
    }
  }, 400);
}

async function loadFromCloud(){
  const sb = getSB();
  if(!sb || !currentUser) return;
  try{
    const { data, error } = await sb.from('user_data').select('data').eq('user_id', currentUser.id).maybeSingle();
    if(error) throw error;
    if(data && data.data && data.data.acc){
      S = cleanState(data.data);
      try{localStorage.setItem('gz2', JSON.stringify(S))}catch(e){}
      render();
      toast('Cloud data loaded ✓');
    } else {
      syncToCloud();
    }
  }catch(err){
    console.error('Cloud load error:', err);
  }
}

const save=()=>{
  try{localStorage.setItem('gz2',JSON.stringify(S))}catch(e){}
  syncToCloud();
};

const vis=()=> (S.acc || []).filter(a=>!a.hid);
const sum=(L,ty)=>(L||[]).filter(t=>t.type===ty).reduce((s,t)=>s+(t.amt||0),0);
const bal=a=> (S.tx || []).reduce((s,t)=>s+(t.type==='inc'&&t.acc===a.id?t.amt:t.type==='exp'&&t.acc===a.id?-t.amt:t.type==='trf'?(t.to===a.id?t.amt:0)-(t.acc===a.id?t.amt:0):0), (a.open||0));
const accN=id=>((S.acc||[]).find(a=>a.id===id)||{name:'?'}).name;
const ce=(ty,n)=>(((S.cats && S.cats[ty])||[]).find(c=>c[0]===n)||[0,'✨'])[1];
const mdate=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return d};
const spentCat=(c,k)=>(S.tx||[]).filter(t=>t.type==='exp'&&t.cat===c&&t.date&&t.date.startsWith(k)).reduce((s,t)=>s+(t.amt||0),0);
const bcls=p=>p>=100?'o':p>=80?'w':'';
function toast(m,u){const t=$('#tt');if(!t)return;t.innerHTML=esc(m)+(u?'<button data-undo="1">Undo</button>':'');undo=u||null;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',u?4500:2600)}
const lbl=x=>{const y=new Date();y.setDate(y.getDate()-1);return x===iso(new Date())?'Today':x===iso(y)?'Yesterday':new Date(x+'T00:00').toLocaleString('en-US',{weekday:'short',day:'numeric',month:'short'})};
const row=(t,sd)=>{const trf=t.type==='trf';return`<button class="r" data-e="${t.id}"><div class="ic">${trf?'🔁':ce(t.type,t.cat)}</div><div><b>${trf?'Transfer':esc(t.cat)}</b><small>${sd?lbl(t.date)+' · ':''}${esc(t.note)||esc(accN(t.acc))}${trf?' → '+esc(accN(t.to)):''}</small></div><span class="num ${t.type==='inc'?'i':t.type==='exp'?'e':''}">${t.type==='inc'?'+':t.type==='exp'?'−':''}${R0(t.amt)}</span></button>`};
const sortT=L=>(L||[]).slice().sort((a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||'')));
function monthBar(d){return`<div class="mn"><button data-o="-1" aria-label="Previous month">‹</button><b>${d.toLocaleString('en-US',{month:'short',year:'numeric'})}</b><button data-o="1" aria-label="Next month">›</button></div>`}
function stats(k,off){const now=new Date(),dim=new Date(+k.slice(0,4),+k.slice(5),0).getDate(),left=off===0?dim-now.getDate()+1:off<0?0:dim;return{dim,left,el:off===0?now.getDate():dim}}

function render(){
  try{
    const d=mdate(),k=ym(d),L=(S.tx||[]).filter(t=>t.date&&t.date.startsWith(k)),inc=sum(L,'inc'),exp=sum(L,'exp'),B=(S.bud&&S.bud.total)||0,I=stats(k,off);let h='';
    const navEl=$('#nav');
    if(navEl) navEl.innerHTML=[['h','🏠','Home'],['s','📊','Stats'],['+','','' ],['q','🔎','Search'],['a','👛','Accounts']].map(([i,e,n])=>i==='+'?'<button class="plus" data-add="1" aria-label="Add record"><b>+</b></button>':`<button data-t="${i}" class="${tab===i?'on':''}"><span>${e}</span>${n}</button>`).join('');
    
    if(tab==='h'){
      const tot=vis().reduce((s,a)=>s+bal(a),0),hr=new Date().getHours();
      h=`<div class="top"><div><small>${hr<12?'Good morning':hr<18?'Good afternoon':'Good evening'} 👋</small><h1>Wallet Manager</h1></div><div style="display:flex;align-items:center"><button class="ib ${currentUser?'logged-in':''}" data-x="auth" aria-label="Account">${currentUser?'👤':'☁️'}<span class="sync-dot"></span></button><button class="ib" data-x="tools" aria-label="Tools">⚙️</button></div></div>
      <div class="hero"><small>Total balance</small><div class="big">${R(tot)}</div><div class="chips"><span>Earned <i>${R0(inc)}</i></span><span class="pk">Spent <i>${R0(exp)}</i></span></div></div>

async function handleAuth(type, em, pw){
  const sb = getSB();
  if(!sb) return toast('Connecting to database...');
  if(!em || !pw) return toast('Enter email & password');
  try{
    if(type==='login'){
      const { data, error } = await sb.auth.signInWithPassword({ email: em, password: pw });
      if(error) throw error;
      currentUser = data.user;
      toast('Logged in successfully!');
      close();
      loadFromCloud();
    } else {
      const { data, error } = await sb.auth.signUp({ email: em, password: pw });
      if(error) throw error;
      if(data.user && !data.session){
        toast('Confirmation email sent! Check inbox.');
      } else {
        currentUser = data.user;
        toast('Account created & logged in!');
        syncToCloud();
      }
      close();
    }
    render();
  }catch(err){
    toast(err.message || 'Auth failed');
  }
}

document.addEventListener('focusin',e=>{if(e.target.matches('#pg input[type=text],#pg input:not([type]),#pg textarea'))$('#pg').classList.add('typing')});
document.addEventListener('focusout',()=>$('#pg').classList.remove('typing'));
document.onkeydown=e=>{if(e.key==='Escape'){close();$('#pg').classList.remove('on')}};

// Passcode lock
let en='';const lk=$('#lk');const lockUI=()=>{$('#dots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<en.length?'f1':''}"></i>`).join('')};
$('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-lk="${k}" aria-label="${k}">${k}</button>`).join('');
$('#pad').onclick=e=>{const b=e.target.closest('[data-lk]');if(!b)return;const k=b.dataset.lk;if(k==='⌫')en=en.slice(0,-1);else if(en.length<4)en+=k;lockUI();if(en.length===4){if(hp(en)===S.pin){lk.classList.remove('on');en=''}else{$('#lm').textContent='Wrong passcode, try again';en=''}setTimeout(lockUI,150)}};
const lock=()=>{if(S.pin){en='';$('#lm').textContent='Enter passcode';lockUI();lk.classList.add('on')}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)lock()});

// Immediate execution
lock();
render();

// Background Session Check
function checkSession(){
  const sb = getSB();
  if(!sb){
    setTimeout(checkSession, 500);
    return;
  }
  try {
    sb.auth.getSession().then(({ data }) => {
      if(data && data.session && data.session.user){
        currentUser = data.session.user;
        loadFromCloud();
        render();
      }
    }).catch(e=>console.warn(e));

    sb.auth.onAuthStateChange((_event, session) => {
      currentUser = session ? session.user : null;
      render();
    });
  } catch(e) {
    console.warn(e);
  }
}
checkSession();

// Service worker unregister check to prevent stale broken cache
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(registrations => {
    // Keeps service worker active but updates it
    for(let registration of registrations) {
      registration.update();
    }
  });
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
</script>
