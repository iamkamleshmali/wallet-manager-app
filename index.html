<style>
:root{
  --bg:#0e0f14;--c1:#151822;--c2:#1e2333;--c3:#2a3148;--ink:#f5f6fb;--mu:#8a91a8;--ln:#24283b;
  --inc:#2979ff; /* Blue for Income */
  --exp:#ff3b56; /* Red for Expense */
  --trf:#8c7ae6; /* Purple for Transfer */
  --acc:#2979ff;--on:#ffffff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#f2f4fa;--c1:#ffffff;--c2:#e8ecf6;--c3:#dbe1f2;--ink:#111420;--mu:#6a728a;--ln:#dce1ef;--inc:#1976d2;--exp:#e53935;--trf:#7b1fa2;--acc:#1976d2;--on:#ffffff}
}
:root[data-theme="light"]{--bg:#f2f4fa;--c1:#ffffff;--c2:#e8ecf6;--c3:#dbe1f2;--ink:#111420;--mu:#6a728a;--ln:#dce1ef;--inc:#1976d2;--exp:#e53935;--trf:#7b1fa2;--acc:#1976d2;--on:#ffffff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:500 14px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,.big,.num{font-family:Sora,'Plus Jakarta Sans',sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:480px;margin:0 auto;padding:12px 14px 110px}

/* Splash Screen */
#splash{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s ease,visibility .4s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{width:86px;height:86px;border-radius:24px;background:linear-gradient(145deg,#1b2438,#111522);display:grid;place-items:center;border:2px solid rgba(41,121,255,0.4);box-shadow:0 12px 35px rgba(41,121,255,0.25);margin-bottom:18px;animation:pulse 1.8s infinite ease-in-out}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.splash-bar{width:140px;height:4px;border-radius:99px;background:var(--c2);overflow:hidden;margin-top:16px}
.splash-bar i{display:block;height:100%;background:var(--inc);width:40%;border-radius:99px;animation:load 1.2s infinite ease-in-out}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}

/* Top Bar */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top small{color:var(--mu);font-size:12px;font-weight:600}.top h1{font-size:21px;font-weight:800;letter-spacing:-0.5px}
.top-actions{display:flex;align-items:center;gap:8px}
.btn-auth{background:var(--c1);border:1px solid var(--ln);color:var(--ink);border-radius:12px;padding:6px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.btn-auth.logged-in{border-color:var(--inc);color:var(--inc)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--inc)}

/* Balance Card */
.hero{background:linear-gradient(135deg,#19233f 0%,#131724 100%);color:#fff;border-radius:24px;padding:18px 18px 16px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.06);box-shadow:0 10px 25px rgba(0,0,0,0.3)}
.hero small{font-weight:600;opacity:.8;font-size:12.5px}.big{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.15;margin:2px 0 12px}
.chips{display:flex;gap:8px}
.chips span{background:rgba(12,14,22,0.7);color:#fff;padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:700;border:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;gap:6px}
.chips .ci i{color:var(--inc);font-style:normal}.chips .ce i{color:var(--exp);font-style:normal}

/* Controls & Month Bar */
.bar2{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px}
.mn{display:flex;align-items:center;background:var(--c1);border-radius:99px;padding:2px;border:1px solid var(--ln)}
.mn button{width:28px;height:28px;font-size:17px;text-align:center;border-radius:50%}.mn b{min-width:78px;text-align:center;font-size:12.5px}
.sg{display:flex;background:var(--c1);border-radius:99px;padding:2px;border:1px solid var(--ln)}
.sg button{padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700;color:var(--mu)}.sg .on{background:var(--c2);color:var(--ink)}

/* Transaction Day Rows */
.day{background:var(--c1);border-radius:18px;padding:4px 14px;margin-bottom:10px;border:1px solid var(--ln)}
.dh{display:flex;justify-content:space-between;padding:9px 0 5px;color:var(--mu);font-size:12px;font-weight:700}
.r{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 0}.r+.r{border-top:1px solid var(--ln)}
.ic{width:38px;height:38px;border-radius:14px;background:var(--c2);display:grid;place-items:center;font-size:19px}
.r small{display:block;color:var(--mu);font-size:11.5px;margin-top:1px}.r b{font-weight:700;font-size:14px}.num{font-weight:700;font-size:14.5px}
.i{color:var(--inc)}.e{color:var(--exp)}.t{color:var(--trf)}
.empty{text-align:center;color:var(--mu);padding:40px 10px;font-size:13px}

/* Accounts Tab Single-Line List */
.acc-card{background:var(--c1);border:1px solid var(--ln);border-radius:18px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.acc-card .acc-left{display:flex;align-items:center;gap:10px}
.acc-card .acc-icon{width:36px;height:36px;border-radius:12px;background:var(--c2);display:grid;place-items:center;font-size:18px}
.acc-card b{font-size:14px;font-weight:700}
.acc-card small{color:var(--mu);font-size:11px}

/* Stats Tab */
.card{background:var(--c1);border-radius:20px;padding:16px;margin-bottom:10px;border:1px solid var(--ln)}
.card h2{font-size:14.5px;margin-bottom:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.grid3>div{background:var(--c1);border-radius:16px;padding:10px;border:1px solid var(--ln)}.grid3 small{color:var(--mu);font-size:10.5px;display:block}.grid3 b{font-family:Sora;font-size:13px}
.ring{display:block;margin:4px auto 10px;width:190px;height:190px}
.lg{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:8px 0;width:100%}.lg i{width:10px;height:10px;border-radius:3px}
.lg .bt{grid-column:2/4;height:5px;border-radius:4px;background:var(--c2);overflow:hidden;margin-top:-2px}.lg .bt u{display:block;height:100%;border-radius:4px}
.wk{display:flex;align-items:flex-end;gap:6px;height:95px}.wk div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:10.5px;color:var(--mu)}.wk i{width:100%;border-radius:6px;background:var(--exp);min-height:4px}

/* More / Settings Grid */
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.more-item{background:var(--c1);border:1px solid var(--ln);border-radius:18px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.more-item:active{transform:scale(0.97)}
.more-item .m-icon{width:42px;height:42px;border-radius:14px;background:var(--c2);display:grid;place-items:center;font-size:20px}
.more-item span{font-size:12px;font-weight:700;color:var(--ink)}

/* Add/Edit Fullscreen Page */
.pg{position:fixed;inset:0;background:var(--bg);z-index:25;display:none;flex-direction:column;overflow:hidden}.pg.on{display:flex}
.pg .in{max-width:480px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:10px 14px;overflow-y:auto}
.ph{display:flex;align-items:center;gap:10px;padding:4px 0 10px}.ph h2{flex:1;font-size:18px}.ph button{width:38px;height:38px;border-radius:12px;background:var(--c1);font-size:16px;text-align:center;border:1px solid var(--ln)}

/* Type Bar (Income 1st, Expense 2nd, Transfer 3rd) */
.tp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tp button{padding:10px;border-radius:14px;background:var(--c1);font-weight:700;text-align:center;border:2px solid transparent;font-size:13px}

/* Field Rows */
.fl{display:grid;grid-template-columns:85px 1fr;align-items:center;padding:11px 4px;border-bottom:1px solid var(--ln);width:100%}
.fl label{color:var(--mu);font-size:13px}.fl input{background:none;border:0;color:var(--ink);font:inherit;width:100%;padding:0}
.fl input:focus{outline:0}.fl input[type=date],.fl input[type=time]{width:auto;color-scheme:dark}
.amw{display:flex;align-items:center;gap:4px;font:700 20px Sora}
.amtv{font:700 20px Sora;letter-spacing:-0.5px}

/* Built-in Calculator Numpad */
.numpad-wrap{background:var(--c1);border-radius:22px 22px 0 0;padding:10px 10px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 25px rgba(0,0,0,0.3);border-top:1px solid var(--ln);margin-top:auto}
.calc-calc-display{background:var(--c2);border-radius:12px;padding:6px 12px;margin-bottom:8px;text-align:right;font:700 13px Sora;color:var(--mu);min-height:26px}
.numpad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.numpad-grid button{padding:12px 0;background:var(--c2);border-radius:14px;font:700 18px Sora;text-align:center}
.numpad-grid button:active{background:var(--c3)}
.numpad-grid .btn-op{background:var(--c3);color:var(--inc);font-size:16px}
.numpad-grid .btn-done{grid-row:span 2;background:var(--inc);color:#fff;font-size:15px;display:grid;place-items:center}

/* Floating Bottom Navigation */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:456px;background:var(--c1);border:1px solid var(--ln);border-radius:30px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:5px 6px;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.nav.has-plus{grid-template-columns:1fr 1fr 68px 1fr 1fr}
.nav button{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:700;color:var(--mu);padding:5px 0;border-radius:18px;gap:2px}
.nav span{font-size:18px}.nav .on{color:var(--ink);background:var(--c2)}
.nav .plus{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,var(--inc),#0052cc);color:#fff;font-size:28px;font-weight:600;margin:-22px auto 0;justify-content:center;box-shadow:0 8px 20px rgba(41,121,255,.45);transform:rotate(45deg)}
.nav .plus b{transform:rotate(-45deg);font-weight:600;display:block}

/* Overlays & Sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:35}.ov.on{display:flex}
.sheet-box{width:100%;max-width:480px;max-height:85vh;overflow:auto;background:var(--c1);padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;animation:up .2s ease-out;border-top:1px solid var(--ln)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh2{font:800 18px Sora;margin-bottom:12px;letter-spacing:-0.5px}
.f{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:9px}
.ok{width:100%;padding:13px;border-radius:14px;font-weight:800;font-size:15px;background:var(--acc);color:#fff;text-align:center}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.cg button{background:var(--c2);border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;font-weight:600}.cg span{display:block;font-size:22px}
.lr{display:flex;justify-content:space-between;padding:13px 4px;width:100%;border-top:1px solid var(--ln)}

/* Toast & Lock Screen */
#tt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-weight:700;font-size:13px;z-index:50;display:none;max-width:90%}
#tt button{font-weight:800;margin-left:10px;color:var(--exp)}
#lk{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}#lk.on{display:flex}
.dots{display:flex;gap:12px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mu)}.dots .f1{background:var(--inc);border-color:var(--inc)}
.pad{display:grid;grid-template-columns:repeat(3,70px);gap:12px}.pad button{height:70px;border-radius:50%;background:var(--c1);font:700 22px Sora;text-align:center;border:1px solid var(--ln)}

.app-brand-footer{text-align:center;margin:28px 0 8px;color:var(--mu);font-size:11.5px;font-weight:600}
.app-brand-footer b{color:var(--ink)}
</style>
</head>

<script>
// --- SUPABASE CONFIG ---
const SB_URL = 'https://hgnrczmdmiuxxwynqbjg.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnbnJjem1kbWl1eHh3eW5xYmpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NzI2ODYsImV4cCI6MjEwNjI0ODY4Nn0.xv0e7ugwzESvHoUD4MJAcDxqTfFxQoKGPeMnmV6JUXs';

let supabase = null;
function getSB(){
  if(!supabase && window.supabase && typeof window.supabase.createClient === 'function'){
    try { supabase = window.supabase.createClient(SB_URL, SB_KEY); }catch(e){}
  }
  return supabase;
}

let currentUser = null;
const DC={
  inc:[['Salary','💼'],['Pocket Money','💸'],['Freelance','💻'],['Scholarship','🎓'],['Gift','🎁'],['Other','💰']],
  exp:[['Food','🍜'],['Transport','🚌'],['Shopping','🛍️'],['Study','📚'],['Hostel / Rent','🏠'],['Recharge','📱'],['Fun','🎮'],['Health','💊'],['Social Life','👫'],['Other','✨']]
};
const GR=['Cash','Accounts','Card','Debit Card','Savings','Top-Up/Prepaid','Investments','Others'];
const COL=['#2979ff','#ff3b56','#8c7ae6','#ffc247','#00d2d3','#ff9f43','#54a0ff','#10ac84'];
const $=q=>document.querySelector(q),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m2=n=>Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),R=n=>'₹'+m2(n),R0=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
const pad=n=>String(n).padStart(2,'0'),ym=d=>d.getFullYear()+'-'+pad(d.getMonth()+1),iso=d=>ym(d)+'-'+pad(d.getDate()),hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());

let S,tab='h',view='l',off=0,st='exp',statsPeriod='monthly',sel='',A=null,undo=null,fresh=0,calcExp='';

function seed(){
  return {
    acc:[{id:'a1',name:'Cash in Hand',g:'Cash',open:0},{id:'a2',name:'UPI / Bank',g:'Accounts',open:0}],
    cats:JSON.parse(JSON.stringify(DC)),
    bud:{total:0,cat:{}},
    pin:'',
    gdriveFreq:'daily',
    tx:[]
  };
}

function cleanState(raw){
  const def = seed();
  if(!raw || typeof raw !== 'object') return def;
  return {
    acc: Array.isArray(raw.acc) && raw.acc.length ? raw.acc : def.acc,
    cats: raw.cats && typeof raw.cats === 'object' ? raw.cats : def.cats,
    bud: raw.bud && typeof raw.bud === 'object' ? raw.bud : def.bud,
    pin: typeof raw.pin === 'string' ? raw.pin : '',
    gdriveFreq: raw.gdriveFreq || 'daily',
    tx: Array.isArray(raw.tx) ? raw.tx : []
  };
}

try { S = cleanState(JSON.parse(localStorage.getItem('gz2'))); } catch(e) { S = seed(); }

// --- CLOUD SYNC ---
let syncTimer = null;
function syncToCloud(){
  const sb = getSB();
  if(!sb || !currentUser) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async ()=>{
    try{
      await sb.from('user_data').upsert({
        user_id: currentUser.id,
        data: JSON.parse(JSON.stringify(S)),
        updated_at: new Date().toISOString()
      });
    }catch(err){console.error('Cloud sync error:', err);}
  }, 400);
}

async function loadFromCloud(){
  const sb = getSB();
  if(!sb || !currentUser) return;
  try{
    const { data, error } = await sb.from('user_data').select('data').eq('user_id', currentUser.id).maybeSingle();
    if(error) throw error;
    if(data && data.data && data.data.acc){
      S = cleanState(data.data);
      try{localStorage.setItem('gz2', JSON.stringify(S))}catch(e){}
      render();
      toast('Cloud synced ✓');
    } else {
      syncToCloud();
    }
  }catch(err){console.error('Cloud load error:', err);}
}

const save=()=>{
  try{localStorage.setItem('gz2',JSON.stringify(S))}catch(e){}
  syncToCloud();
};

const vis=()=> (S.acc || []).filter(a=>!a.hid);

// Built-in Calculator & Numpad Engine
function handleNumpad(k){
  if(k === 'done'){
    if(calcExp){
      try {
        const val = Function('"use strict";return (' + calcExp.replace(/[^0-9+\-*/.]/g,'') + ')')();
        A.amt = String(Math.round(val * 100) / 100);
      } catch(e){}
      calcExp = '';
    }
    if(!A.amt || parseFloat(A.amt) <= 0){
      return toast('Please enter an amount');
    }
    if(A.type !== 'trf' && !A.cat){
      pickSheet('cat');
      return;
    }
    doneAdd();
    return;
  }

  if(k === 'C'){
    calcExp = '';
    A.amt = '';
  } else if(k === '⌫'){
    if(calcExp.length > 0){
      calcExp = calcExp.slice(0, -1);
    } else {
      A.amt = String(A.amt||'').slice(0, -1);
    }
  } else if(['+','-','*','/'].includes(k)){
    if(!calcExp) calcExp = (A.amt || '0');
    calcExp += k;
  } else {
    if(calcExp){
      calcExp += k;
    } else {
      let v = String(A.amt || '');
      if(k === '.'){
        if(!v.includes('.')) v = (v || '0') + '.';
      } else {
        if(v === '0' && k !== '0') v = k;
        else if(v.includes('.')){
          if(v.split('.')[1].length < 2) v += k;
        } else {
          if(v.length < 8) v += k;
        }
      }
      A.amt = v;
    }
  }

  const cdisp = $('#calc_disp');
  const adisp = $('#disp_amt');
  if(cdisp) cdisp.textContent = calcExp || (A.amt ? 'Amount: ₹' + A.amt : 'Calculator Ready');
  
  if(calcExp){
    try {
      const evalVal = Function('"use strict";return (' + calcExp.replace(/[^0-9+\-*/.]/g,'') + ')')();
      if(adisp) adisp.textContent = isFinite(evalVal) ? String(Math.round(evalVal * 100)/100) : '...';
    } catch(e){}
  } else {
    if(adisp) adisp.textContent = A.amt || '0';
  }
}

function pickSheet(kind){
  if(kind==='cat'){
    const l=S.cats[A.type]||[];
    sheet(`<div class="sh2">Select Category</div>
      <div class="cg">${l.map(c=>`<button type="button" data-pc="${esc(c[0])}"><span>${c[1]}</span>${esc(c[0])}</button>`).join('')}</div>
      <label style="color:var(--mu);font-size:12px;margin:10px 0 4px;display:block">Create New Category</label>
      <div style="display:flex;gap:8px"><input class="f" name="e" placeholder="🏷️" maxlength="4" style="width:65px"><input class="f" name="n" placeholder="Name" maxlength="18" required></div>
      <button class="ok">Add & Use</button>`,
      fd=>{
        const n=fd.get('n').trim();if(!S.cats[A.type])S.cats[A.type]=[];
        S.cats[A.type].push([n,fd.get('e').trim()||'🏷️']);A.cat=n;save();close();addR();
      });
  } else {
    sheet(`<div class="sh2">${kind==='to'?'Transfer To':'Account'}</div>${acs().map(a=>`<button type="button" class="lr" data-pa="${kind}:${a.id}"><span>${esc(a.name)}</span><b class="num" style="color:var(--mu)">${R0(bal(a))}</b></button>`).join('')}`);
  }
}

function doneAdd(){
  if(calcExp){
    try {
      const val = Function('"use strict";return (' + calcExp.replace(/[^0-9+\-*/.]/g,'') + ')')();
      A.amt = String(Math.round(val * 100) / 100);
    } catch(e){}
  }
  const n=parseFloat(A.amt);
  if(!(n>0)) return toast('Enter a valid amount');
  if(A.type!=='trf'&&!A.cat) return toast('Select a category');
  if(A.type==='trf'&&A.acc===A.to) return toast('Select two different accounts');
  
  const r={
    id:A.id||uid(),
    type:A.type,
    cat:A.type==='trf'?'':A.cat,
    amt:n,
    note:(A.note||'').trim(),
    acc:A.acc,
    to:A.type==='trf'?A.to:'',
    date:A.date||iso(new Date()),
    time:A.time||''
  };
  S.tx=(S.tx||[]).filter(x=>x.id!==r.id).concat(r);
  save();
  $('#pg').classList.remove('on');
  render();
  toast('Transaction Saved ✓');
}

}

    <p style="color:var(--mu);font-size:13px;margin-bottom:14px">Sync and backup your wallet data to your Google Drive automatically.</p>
    <label style="color:var(--mu);font-size:12px;margin-bottom:4px;display:block">Auto Backup Frequency</label>
    <select class="f" name="freq" id="gd_freq">
      <option value="daily" ${S.gdriveFreq==='daily'?'selected':''}>Daily (Recommended)</option>
      <option value="weekly" ${S.gdriveFreq==='weekly'?'selected':''}>Weekly</option>
      <option value="monthly" ${S.gdriveFreq==='monthly'?'selected':''}>Monthly</option>
      <option value="manual" ${S.gdriveFreq==='manual'?'selected':''}>Manual Only</option>
    </select>
    <button type="button" class="ok" id="btn_gd_connect" style="margin-bottom:8px">Download / Save to Drive</button>
    <button type="submit" class="ok" style="background:var(--c2);color:var(--ink)">Save Frequency</button>
  `, fd=>{
    S.gdriveFreq = fd.get('freq');
    save();close();toast('Drive sync set to: ' + S.gdriveFreq);
  });

  $('#btn_gd_connect').onclick=()=>{
    const blob = new Blob([JSON.stringify(S, null, 2)], {type : 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Wallet_Manager_Backup_${iso(new Date())}.json`;
    a.click();
    toast('Backup downloaded. Save to your Google Drive!');
    close();
  };
}

function accSheet(id){
  const a=(S.acc||[]).find(x=>x.id===id)||{name:'',g:'Cash',open:''};
  sheet(`<div class="sh2">${id?'Edit Account':'New Account'}</div>
  <label style="color:var(--mu);font-size:12px;display:block;margin-bottom:4px">Account Name</label>
  <input class="f" name="n" placeholder="e.g. Cash in Hand, UPI, Bank" required maxlength="30" value="${esc(a.name)}" autofocus>
  <label style="color:var(--mu);font-size:12px;display:block;margin-bottom:4px">Account Group</label>
  <select class="f" name="g">${GR.map(g=>`<option ${g===a.g?'selected':''}>${g}</option>`).join('')}</select>
  <label style="color:var(--mu);font-size:12px;display:block;margin-bottom:4px">Starting Balance (₹)</label>
  <input class="f" name="o" type="number" step="0.01" placeholder="0.00" value="${a.open}">
  <button class="ok">Save Account</button>`,fd=>{
    const v={name:fd.get('n').trim(),g:fd.get('g'),open:parseFloat(fd.get('o'))||0};
    if(id)Object.assign(a,v);else (S.acc=S.acc||[]).push({id:uid(),...v});
    save();close();render();
  });
}

// Cloud Auth Modal
function authSheet(){
  const sb = getSB();
  if(!sb) return toast('Connecting to Supabase cloud...');
  if(currentUser){
    sheet(`
      <div class="sh2">Cloud Account</div>
      <p style="color:var(--mu);margin-bottom:12px">Logged in as:<br><b style="color:var(--ink)">${esc(currentUser.email)}</b></p>
      <div style="background:var(--c2);padding:12px;border-radius:14px;margin-bottom:14px;font-size:12.5px;color:var(--inc);display:flex;align-items:center;gap:6px">
        <span class="sync-dot"></span> Realtime cloud sync is Active.
      </div>
      <button type="button" class="ok" style="background:var(--c2);color:var(--ink);margin-bottom:8px" data-x="manualsync">Sync Cloud Now</button>
      <button type="button" class="ok" style="background:var(--exp);color:#fff" data-x="logout">Log Out</button>
    `);
  } else {
    sheet(`
      <div class="sh2">Sign In or Sign Up</div>
      <p style="color:var(--mu);font-size:12.5px;margin-bottom:12px">Access your wallet data across any mobile or desktop device.</p>
      <input class="f" type="email" name="em" id="in_em" placeholder="name@example.com" required autofocus>
      <input class="f" type="password" name="pw" id="in_pw" placeholder="Password (min 6 characters)" minlength="6" required>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button type="button" class="ok" data-auth="login" style="flex:1">Log In</button>
        <button type="button" class="ok" data-auth="signup" style="flex:1;background:var(--c2);color:var(--ink)">Sign Up</button>
      </div>
    `);
  }
}

async function handleAuth(type, em, pw){
  const sb = getSB();
  if(!sb) return toast('Connecting to database...');
  if(!em || !pw) return toast('Enter email & password');
  try{
    if(type==='login'){
      const { data, error } = await sb.auth.signInWithPassword({ email: em, password: pw });
      if(error) throw error;
      currentUser = data.user;
      toast('Welcome back! Logged in.');
      close();
      loadFromCloud();
    } else {
      const { data, error } = await sb.auth.signUp({ email: em, password: pw });
      if(error) throw error;
      if(data.user && !data.session){
        toast('Confirm email sent! Check inbox.');
      } else {
        currentUser = data.user;
        toast('Account created & logged in!');
        syncToCloud();
      }
      close();
    }
    render();
  }catch(err){
    toast(err.message || 'Authentication error');
  }
}

// Global Click Handlers
document.addEventListener('click',async e=>{
  const c=e.target.closest('[data-t],[data-v],[data-o],[data-st],[data-e],[data-ty],[data-a],[data-pc],[data-pa],[data-add],[data-x],[data-undo],[data-sd],[data-ea],[data-auth],[data-k],[data-per]');
  if(e.target===$('#ov')){close();return}
  if(!c)return;const D=c.dataset;

  // Custom built-in Numpad click
  if(D.k!==undefined){
    handleNumpad(D.k);
    return;
  }

  // Stats Period toggle
  if(D.per!==undefined){
    statsPeriod = D.per;
    render();
    return;
  }

  if(D.auth){
    const em = ($('#in_em') ? $('#in_em').value : '').trim();
    const pw = ($('#in_pw') ? $('#in_pw').value : '').trim();
    handleAuth(D.auth, em, pw);
    return;
  }

  if(D.t){tab=D.t;render();scrollTo(0,0)}
  else if(D.v){view=D.v;render()}
  else if(D.o){off=Math.min(0,off+ +D.o);render()}
  else if(D.st){st=D.st;render()}
  else if(D.sd){sel=D.sd;render()}
  else if(D.add!==undefined)openAdd();
  else if(D.e)openAdd((S.tx||[]).find(t=>t.id===D.e));
  else if(D.ty){A.type=D.ty;if(!((S.cats&&S.cats[D.ty])||[]).find(x=>x[0]===A.cat))A.cat='';addR()}
  
  else if(D.a==='close')$('#pg').classList.remove('on');
  else if(D.a==='cat')pickSheet('cat');
  else if(D.a==='acc')pickSheet('acc');
  else if(D.a==='to')pickSheet('to');
  else if(D.a==='del'){
    const t=(S.tx||[]).find(x=>x.id===A.id);
    S.tx=(S.tx||[]).filter(x=>x.id!==A.id);
    save();$('#pg').classList.remove('on');render();
    toast('Record deleted',()=>{S.tx.push(t);save();render()});
  }
  else if(D.pc){A.cat=D.pc;close();addR()}
  else if(D.pa){const[kd,id]=D.pa.split(':');if(kd==='to')A.to=id;else A.acc=id;close();addR()}
  else if(D.undo){if(undo)undo();$('#tt').style.display='none'}
  else if(D.ea)accSheet(D.ea);
  else if(D.x){
    const x=D.x;
    if(x==='auth')authSheet();
    else if(x==='gdrive')gdriveSheet();
    else if(x==='new_acc')accSheet();
    else if(x==='manualsync'){await syncToCloud();await loadFromCloud();toast('Synced with cloud ✓');close()}
    else if(x==='logout'){const sb=getSB();if(sb)await sb.auth.signOut();currentUser=null;close();render();toast('Logged out')}
    else if(x==='pin')pinSheet();
    else if(x==='pdf')window.print();
    else if(x==='theme'){const r=document.documentElement,l=r.dataset.theme==='light'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:light)').matches);r.dataset.theme=l?'dark':'light';close()}
    else if(x==='bk'){
      sheet(`<div class="sh2">JSON Backup</div><button type="button" class="ok" id="cp_bk_btn" style="margin-bottom:10px">Copy Backup Code</button><label style="color:var(--mu);font-size:12px;display:block;margin-bottom:4px">Restore JSON</label><textarea class="f" name="j" rows="4" placeholder="Paste backup JSON"></textarea><button class="ok" style="background:var(--exp);color:#fff">Restore Data</button>`,fd=>{
        try{const j=JSON.parse(fd.get('j'));if(j.acc&&j.tx){S=cleanState(j);save();close();render();toast('Backup restored ✓')}}catch(z){toast('Invalid backup JSON')}
      });
      $('#cp_bk_btn').onclick=()=>{navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Backup code copied!'))};
    }
    else if(x==='feedback'){
      sheet(`<div class="sh2">Feedback</div><p style="color:var(--mu);font-size:13px;margin-bottom:10px">Have any suggestions to improve Wallet Manager?</p><textarea class="f" rows="4" placeholder="Type your feedback here..."></textarea><button type="button" class="ok" onclick="close();toast('Thank you for your feedback!')">Send Feedback</button>`);
    }
    else if(x==='about'){
      sheet(`<div class="sh2">About Wallet Manager</div>
      <div style="text-align:center;padding:12px 0">
        <div style="width:68px;height:68px;border-radius:20px;background:#182033;margin:0 auto 12px;display:grid;place-items:center;border:2px solid #2979ff;box-shadow:0 8px 25px rgba(41,121,255,0.3)">
          <svg viewBox="0 0 100 100" width="46" height="46">
            <rect x="22" y="16" width="56" height="26" rx="6" fill="#ff3b56" opacity="0.9"/>
            <rect x="14" y="28" width="72" height="52" rx="14" fill="#1b2034" stroke="#2979ff" stroke-width="3.5"/>
            <path d="M60 46 H85 A6 6 0 0 1 91 52 V62 A6 6 0 0 1 85 68 H60 Z" fill="#252c48" stroke="#2979ff" stroke-width="2.5"/>
            <circle cx="77" cy="57" r="4.5" fill="#ff3b56"/>
          </svg>
        </div>
        <h3 style="font:800 19px Sora">Wallet Manager</h3>
        <p style="color:var(--mu);font-size:12.5px;margin:4px 0 14px">Smart, Offline-First Personal Finance Tracker</p>
        <div style="background:var(--c2);padding:14px;border-radius:16px;font-size:13px;line-height:1.6">
          Official Release v2.5<br>
          <small style="color:var(--mu)">Equipped with In-Built Calculator, Google Drive Sync & Analytics</small>
        </div>
      </div>
      <button type="button" class="ok" onclick="close()" style="margin-top:12px">Close</button>`);
    }
    else if(x==='fresh'){
      if(fresh){S.tx=[];S.bud={total:0,cat:{}};(S.acc||[]).forEach(a=>a.open=0);save();fresh=0;close();render();toast('All clear!')}
      else{fresh=1;toast('Tap "Reset Data" again to confirm erase');setTimeout(()=>fresh=0,4000)}
    }
  }
});

// Dynamic Note Input
document.addEventListener('input',e=>{
  if(!A) return;
  if(e.target.id==='an') A.note=e.target.value;
  if(e.target.id==='ad') A.date=e.target.value;
  if(e.target.id==='at') A.time=e.target.value;
});

document.onkeydown=e=>{if(e.key==='Escape'){close();$('#pg').classList.remove('on')}};

// Passcode Lock UI
let en='';const lk=$('#lk');const lockUI=()=>{$('#dots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<en.length?'f1':''}"></i>`).join('')};
$('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-lk="${k}">${k}</button>`).join('');
$('#pad').onclick=e=>{
  const b=e.target.closest('[data-lk]');if(!b)return;
  const k=b.dataset.lk;
  if(k==='⌫')en=en.slice(0,-1);else if(en.length<4)en+=k;
  lockUI();
  if(en.length===4){
    if(hp(en)===S.pin){lk.classList.remove('on');en=''}
    else{$('#lm').textContent='Wrong passcode, try again';en=''}
    setTimeout(lockUI,150);
  }
};
const lock=()=>{if(S.pin){en='';$('#lm').textContent='Enter passcode';lockUI();lk.classList.add('on')}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)lock()});

// Initial startup
lock();
render();

// Dismiss splash screen smoothly
window.addEventListener('load', () => {
  setTimeout(() => {
    const sp = $('#splash');
    if(sp) sp.classList.add('hide');
  }, 450);
});

// Safe Session Check
function checkSession(){
  const sb = getSB();
  if(!sb){ setTimeout(checkSession, 500); return; }
  try {
    sb.auth.getSession().then(({ data }) => {
      if(data && data.session && data.session.user){
        currentUser = data.session.user;
        loadFromCloud();
        render();
      }
    }).catch(e=>console.warn(e));

    sb.auth.onAuthStateChange((_event, session) => {
      currentUser = session ? session.user : null;
      render();
    });
  } catch(e) { console.warn(e); }
}
checkSession();

// Service Worker update
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(registrations => {
    for(let r of registrations) r.update();
  });
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
</script>
