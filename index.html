<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wallet Manager</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0e0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Supabase Async CDN -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0e0f14;--c1:#161822;--c2:#212435;--c3:#2c3048;--ink:#f5f6fb;--mu:#8b92a8;--ln:#26293c;
  --inc:#2979ff; /* Blue for Income */
  --exp:#ff3b56; /* Red for Expense */
  --trf:#8c7ae6; /* Violet/Purple for Transfer */
  --acc:#2979ff;--on:#ffffff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#f1f3f9;--c1:#ffffff;--c2:#e5e8f4;--c3:#d5daf0;--ink:#10121d;--mu:#68708c;--ln:#dce0ee;--inc:#1976d2;--exp:#e53935;--trf:#7b1fa2;--acc:#1976d2;--on:#ffffff}
}
:root[data-theme="light"]{--bg:#f1f3f9;--c1:#ffffff;--c2:#e5e8f4;--c3:#d5daf0;--ink:#10121d;--mu:#68708c;--ln:#dce0ee;--inc:#1976d2;--exp:#e53935;--trf:#7b1fa2;--acc:#1976d2;--on:#ffffff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:500 15px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh}
h1,h2,.big,.num{font-family:Sora,'Plus Jakarta Sans',sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:480px;margin:0 auto;padding:14px 14px 130px}

/* Top Bar */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top small{color:var(--mu);font-size:12.5px}.top h1{font-size:22px;font-weight:800;letter-spacing:-0.5px}
.top-actions{display:flex;align-items:center;gap:8px}
.btn-auth{background:var(--c1);border:1px solid var(--ln);color:var(--ink);border-radius:14px;padding:8px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.btn-auth.logged-in{border-color:var(--inc);color:var(--inc)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--inc);display:inline-block}

/* Hero Balance Card */
.hero{background:linear-gradient(135deg, #1b284f 0%, #161a29 100%);color:#fff;border-radius:26px;padding:22px 20px 18px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.06);box-shadow:0 12px 30px rgba(0,0,0,0.3)}
.hero::after{content:"";position:absolute;right:-25px;top:-25px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(41,121,255,0.3) 0%,rgba(0,0,0,0) 70%)}
.hero small{font-weight:600;opacity:.8;font-size:13px;letter-spacing:0.3px}.big{font-size:36px;font-weight:800;letter-spacing:-1.2px;line-height:1.15;margin:3px 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span{background:rgba(12,14,22,0.7);color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;gap:6px}
.chips .ci i{color:var(--inc);font-style:normal}.chips .ce i{color:var(--exp);font-style:normal}

/* Controls */
.bar2{display:flex;justify-content:space-between;align-items:center;margin:16px 0 12px}
.mn{display:flex;align-items:center;background:var(--c1);border-radius:99px;padding:3px;border:1px solid var(--ln)}.mn button{width:32px;height:32px;font-size:18px;text-align:center;border-radius:50%}.mn b{min-width:84px;text-align:center;font-size:13px}
.sg{display:flex;background:var(--c1);border-radius:99px;padding:3px;border:1px solid var(--ln)}.sg button{padding:7px 13px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--mu)}.sg .on{background:var(--c2);color:var(--ink)}

/* Filter Pills */
.filter-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.filter-scroll::-webkit-scrollbar{display:none}
.fpill{padding:6px 12px;border-radius:99px;background:var(--c1);border:1px solid var(--ln);font-size:12px;font-weight:600;color:var(--mu);white-space:nowrap}
.fpill.on{background:var(--c2);color:var(--ink);border-color:var(--mu)}

/* Day list */
.day{background:var(--c1);border-radius:22px;padding:6px 16px;margin-bottom:10px;border:1px solid var(--ln)}
.dh{display:flex;justify-content:space-between;padding:10px 0 6px;color:var(--mu);font-size:12.5px;font-weight:700}
.r{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;width:100%;padding:11px 0}.r+.r{border-top:1px solid var(--ln)}
.ic{width:42px;height:42px;border-radius:15px;background:var(--c2);display:grid;place-items:center;font-size:20px}
.r small{display:block;color:var(--mu);font-size:12px;margin-top:1px}.r b{font-weight:700;font-size:14.5px}.num{font-weight:700;font-size:15px}
.i{color:var(--inc)}.e{color:var(--exp)}.t{color:var(--trf)}

/* Stats & Cards */
.card{background:var(--c1);border-radius:24px;padding:18px 16px;margin-bottom:12px;border:1px solid var(--ln)}
.card h2{font-size:15px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.grid3>div{background:var(--c1);border-radius:18px;padding:12px;border:1px solid var(--ln)}.grid3 small{color:var(--mu);font-size:11px;display:block}.grid3 b{font-family:Sora;font-size:13.5px}
.ring{display:block;margin:6px auto 12px;width:210px;height:210px}
.lg{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:9px 0;width:100%}.lg i{width:12px;height:12px;border-radius:4px}
.lg .bt{grid-column:2/4;height:6px;border-radius:4px;background:var(--c2);overflow:hidden;margin-top:-3px}.lg .bt u{display:block;height:100%;border-radius:4px}
.wk{display:flex;align-items:flex-end;gap:8px;height:110px}.wk div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;font-size:11px;color:var(--mu)}.wk i{width:100%;border-radius:8px;background:var(--exp);min-height:4px}

/* Settings Grid (From User Screenshot) */
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.more-item{background:var(--c1);border:1px solid var(--ln);border-radius:20px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;transition:transform .15s}
.more-item:active{transform:scale(0.97)}
.more-item .m-icon{width:46px;height:46px;border-radius:15px;background:var(--c2);display:grid;place-items:center;font-size:22px}
.more-item span{font-size:12.5px;font-weight:700;color:var(--ink)}

/* Custom Built-In Numpad for Add Record */
.numpad-wrap{background:var(--c1);border-radius:24px 24px 0 0;padding:12px 10px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,0.35);border-top:1px solid var(--ln)}
.quick-chips{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto}
.quick-chip{flex:1;background:var(--c2);color:var(--ink);padding:8px 0;border-radius:12px;font-size:13px;font-weight:700;text-align:center}
.numpad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.numpad-grid button{padding:14px 0;background:var(--c2);border-radius:16px;font:700 20px Sora;text-align:center}
.numpad-grid button:active{background:var(--c3)}
.numpad-grid .btn-done{grid-row:span 2;background:var(--acc);color:#fff;font-size:16px;display:grid;place-items:center}

/* Floating Bottom Navigation */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:456px;background:var(--c1);border:1px solid var(--ln);border-radius:32px;display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;align-items:center;padding:5px 6px;z-index:10;box-shadow:0 12px 35px rgba(0,0,0,.45)}
.nav button{display:flex;flex-direction:column;align-items:center;font-size:10.5px;font-weight:700;color:var(--mu);padding:6px 0;border-radius:20px;gap:2px}
.nav span{font-size:20px}.nav .on{color:var(--ink);background:var(--c2)}
.nav .plus{width:56px;height:56px;border-radius:20px;background:linear-gradient(135deg,var(--inc),#0052cc);color:#fff;font-size:32px;font-weight:600;margin:-24px auto 0;justify-content:center;box-shadow:0 8px 22px rgba(41,121,255,.45);transform:rotate(45deg)}
.nav .plus b{transform:rotate(-45deg);font-weight:600;display:block}

/* Overlays & Sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:25}.ov.on{display:flex}
.ov form,.ov .sheet-box{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:var(--c1);padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;animation:up .22s ease-out;border-top:1px solid var(--ln)}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.sh2{font:800 19px Sora;margin-bottom:12px;letter-spacing:-0.5px}
.f{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:9px}
.ok{width:100%;padding:14px;border-radius:16px;font-weight:800;font-size:15.5px;background:var(--acc);color:#fff;text-align:center}
.lab{font-size:12.5px;color:var(--mu);margin:8px 0 5px;display:block}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.cg button{background:var(--c2);border-radius:16px;padding:12px 4px;text-align:center;font-size:12.5px;font-weight:600}.cg span{display:block;font-size:24px}
.lr{display:flex;justify-content:space-between;padding:15px 4px;width:100%;border-top:1px solid var(--ln)}
.pg{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;overflow:auto}.pg.on{display:flex}
.pg .in{max-width:480px;width:100%;margin:0 auto;flex:1;padding:12px 16px}
.ph{display:flex;align-items:center;gap:12px;padding:6px 0 14px}.ph h2{flex:1;font-size:19px}.ph button{width:42px;height:42px;border-radius:14px;background:var(--c1);font-size:18px;text-align:center;border:1px solid var(--ln)}
.tp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.tp button{padding:12px;border-radius:16px;background:var(--c1);font-weight:700;text-align:center;border:2px solid transparent}
.fl{display:grid;grid-template-columns:92px 1fr;align-items:center;padding:13px 4px;border-bottom:1px solid var(--ln);width:100%}
.fl label{color:var(--mu);font-size:13.5px}.fl input{background:none;border:0;color:var(--ink);font:inherit;width:100%;padding:0}.fl input:focus{outline:0}
.fl input[type=date],.fl input[type=time]{width:auto;color-scheme:dark}
.amw{display:flex;align-items:center;gap:4px}.amw span,.amtv{font:800 32px Sora;letter-spacing:-1px}
.tag-input{background:none;border:0;color:var(--ink);font:inherit;width:100%}

/* Toast & Lock */
#tt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(105px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:700;font-size:13.5px;z-index:50;display:none;max-width:90%}
#tt button{font-weight:800;margin-left:12px;color:var(--exp)}
#lk{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px}#lk.on{display:flex}
.dots{display:flex;gap:14px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mu)}.dots .f1{background:var(--inc);border-color:var(--inc)}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px}.pad button{height:74px;border-radius:50%;background:var(--c1);font:700 24px Sora;text-align:center;border:1px solid var(--ln)}

/* KM Branding Footer */
.km-footer{text-align:center;margin:32px 0 10px;color:var(--mu);font-size:11.5px;font-weight:600;letter-spacing:0.5px}
.km-footer b{color:var(--ink)}

/* Printable Statement */
@media print{
  body{background:#fff;color:#000}
  .nav,.top-actions,.bar2,.filter-scroll,.plus,.ph button{display:none!important}
  main{padding:0;max-width:100%}
  .hero{background:#f1f3f9!important;color:#000!important}
  .day{border:1px solid #ccc;break-inside:avoid}
}
</style>
</head>
<body>
<main id="v"></main>
<nav class="nav" id="nav"></nav>
<div class="pg" id="pg"></div>
<div class="ov" id="ov"></div>
<div id="tt"></div>
<div id="lk">
  <div style="font-size:38px;margin-bottom:-10px">👛</div>
  <h1>Wallet Manager</h1>
  <div id="lm" style="color:var(--mu)">Enter passcode</div>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
</div>

<script>
// --- SUPABASE CONFIG ---
const SB_URL = 'https://hgnrczmdmiuxxwynqbjg.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnbnJjem1kbWl1eHh3eW5xYmpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NzI2ODYsImV4cCI6MjEwNjI0ODY4Nn0.xv0e7ugwzESvHoUD4MJAcDxqTfFxQoKGPeMnmV6JUXs';

let supabase = null;
function getSB(){
  if(!supabase && window.supabase && typeof window.supabase.createClient === 'function'){
    try { supabase = window.supabase.createClient(SB_URL, SB_KEY); }catch(e){}
  }
  return supabase;
}

let currentUser = null;
const DC={
  exp:[['Food','🍜'],['Transport','🚌'],['Shopping','🛍️'],['Study','📚'],['Hostel / Rent','🏠'],['Recharge','📱'],['Fun','🎮'],['Health','💊'],['Social Life','👫'],['Split Share','🤝'],['Other','✨']],
  inc:[['Pocket Money','💸'],['Salary','💼'],['Freelance','💻'],['Scholarship','🎓'],['Gift','🎁'],['Other','💰']]
};
const GR=['Cash','Accounts','Card','Debit Card','Savings','Top-Up/Prepaid','Investments','Overdrafts','Loan','Others'];
const COL=['#2979ff','#ff3b56','#8c7ae6','#ffc247','#00d2d3','#ff9f43','#54a0ff','#5f27cd','#ee5253','#10ac84'];
const $=q=>document.querySelector(q),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m2=n=>Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),R=n=>'₹'+m2(n),R0=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
const pad=n=>String(n).padStart(2,'0'),ym=d=>d.getFullYear()+'-'+pad(d.getMonth()+1),iso=d=>ym(d)+'-'+pad(d.getDate()),hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());

let S,tab='h',view='l',off=0,st='exp',mode='',sel='',A=null,undo=null,fresh=0,activeTag='',activeCatFilter='';

function seed(){
  return {
    acc:[{id:'a1',name:'Cash in Hand',g:'Cash',open:0},{id:'a2',name:'UPI / Bank',g:'Accounts',open:0}],
    cats:JSON.parse(JSON.stringify(DC)),
    bud:{total:0,cat:{}},
    pin:'',
    tx:[]
  };
}

function cleanState(raw){
  const def = seed();
  if(!raw || typeof raw !== 'object') return def;
  return {
    acc: Array.isArray(raw.acc) && raw.acc.length ? raw.acc : def.acc,
    cats: raw.cats && typeof raw.cats === 'object' ? raw.cats : def.cats,
    bud: raw.bud && typeof raw.bud === 'object' ? raw.bud : def.bud,
    pin: typeof raw.pin === 'string' ? raw.pin : '',
    tx: Array.isArray(raw.tx) ? raw.tx : []
  };
}

try {
  S = cleanState(JSON.parse(localStorage.getItem('gz2')));
} catch(e) {
  S = seed();
}

// --- CLOUD SYNC ---
let syncTimer = null;
function syncToCloud(){
  const sb = getSB();
  if(!sb || !currentUser) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async ()=>{
    try{
      await sb.from('user_data').upsert({
        user_id: currentUser.id,
        data: JSON.parse(JSON.stringify(S)),
        updated_at: new Date().toISOString()
      });
    }catch(err){console.error('Cloud sync error:', err);}
  }, 400);
}

async function loadFromCloud(){
  const sb = getSB();
  if(!sb || !currentUser) return;
  try{
    const { data, error } = await sb.from('user_data').select('data').eq('user_id', currentUser.id).maybeSingle();
    if(error) throw error;
    if(data && data.data && data.data.acc){
      S = cleanState(data.data);
      try{localStorage.setItem('gz2', JSON.stringify(S))}catch(e){}
      render();
      toast('Cloud synced ✓');
    } else {
      syncToCloud();
    }
  }catch(err){console.error('Cloud load error:', err);}
}

const save=()=>{
  try{localStorage.setItem('gz2',JSON.stringify(S))}catch(e){}
  syncToCloud();
};

const vis=()=> (S.acc || []).filter(a=>!a.hid);
const sum=(L,ty)=>(L||[]).filter(t=>t.type===ty).reduce((s,t)=>s+(t.amt||0),0);
const bal=a=> (S.tx || []).reduce((s,t)=>s+(t.type==='inc'&&t.acc===a.id?t.amt:t.type==='exp'&&t.acc===a.id?-t.amt:t.type==='trf'?(t.to===a.id?t.amt:0)-(t.acc===a.id?t.amt:0):0), (a.open||0));
const accN=id=>((S.acc||[]).find(a=>a.id===id)||{name:'?'}).name;
const ce=(ty,n)=>(((S.cats && S.cats[ty])||[]).find(c=>c[0]===n)||[0,'✨'])[1];
const mdate=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return d};
function toast(m,u){const t=$('#tt');if(!t)return;t.innerHTML=esc(m)+(u?'<button data-undo="1">Undo</button>':'');undo=u||null;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',u?4500:2600)}
const lbl=x=>{const y=new Date();y.setDate(y.getDate()-1);return x===iso(new Date())?'Today':x===iso(y)?'Yesterday':new Date(x+'T00:00').toLocaleString('en-US',{weekday:'short',day:'numeric',month:'short'})};

const row=(t,sd)=>{
  const trf=t.type==='trf', isInc=t.type==='inc', isExp=t.type==='exp';
  const cls = isInc ? 'i' : (isExp ? 'e' : 't');
  const sign = isInc ? '+' : (isExp ? '−' : '⇄ ');
  const tagBadge = t.tag ? `<span style="background:var(--c2);padding:2px 6px;border-radius:6px;font-size:10.5px;color:var(--inc);margin-left:4px">#${esc(t.tag)}</span>` : '';
  const splitBadge = t.splitWith ? `<span style="background:var(--c2);padding:2px 6px;border-radius:6px;font-size:10.5px;color:var(--exp);margin-left:4px">👥 ${esc(t.splitWith)}</span>` : '';
  return `<button class="r" data-e="${t.id}"><div class="ic">${trf?'🔁':ce(t.type,t.cat)}</div><div><b>${trf?'Transfer':esc(t.cat)}${tagBadge}${splitBadge}</b><small>${sd?lbl(t.date)+' · ':''}${esc(t.note)||esc(accN(t.acc))}${trf?' → '+esc(accN(t.to)):''}</small></div><span class="num ${cls}">${sign}${R0(t.amt)}</span></button>`;
};

const sortT=L=>(L||[]).slice().sort((a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||'')));
function monthBar(d){return`<div class="mn"><button data-o="-1" aria-label="Previous month">‹</button><b>${d.toLocaleString('en-US',{month:'short',year:'numeric'})}</b><button data-o="1" aria-label="Next month">›</button></div>`}
function stats(k,off){const now=new Date(),dim=new Date(+k.slice(0,4),+k.slice(5),0).getDate(),left=off===0?dim-now.getDate()+1:off<0?0:dim;return{dim,left,el:off===0?now.getDate():dim}}

function render(){
  try{
    const d=mdate(),k=ym(d);
    let L=(S.tx||[]).filter(t=>t.date&&t.date.startsWith(k));
    if(activeTag) L = L.filter(t=>t.tag===activeTag);
    if(activeCatFilter) L = L.filter(t=>t.cat===activeCatFilter);

    const inc=sum(L,'inc'),exp=sum(L,'exp'),I=stats(k,off);let h='';

// Built-in Numpad Key Press Handler
function handleNumpad(k){
  let v = String(A.amt || '');
  if(k === 'C'){ v = ''; }
  else if(k === '⌫'){ v = v.slice(0, -1); }
  else if(k.startsWith('+')){
    const addVal = parseInt(k.replace('+', ''), 10) || 0;
    v = String((parseFloat(v) || 0) + addVal);
  }
  else if(k === '.'){
    if(!v.includes('.')) v = (v || '0') + '.';
  }
  else {
    if(v === '0' && k !== '0') v = k;
    else if(v.includes('.')){
      const parts = v.split('.');
      if(parts[1].length < 2) v += k;
    } else {
      if(v.length < 9) v += k;
    }
  }
  A.amt = v;
  const disp = $('#disp_amt');
  if(disp) disp.textContent = v || '0';
}

async function handleAuth(type, em, pw){
  const sb = getSB();
  if(!sb) return toast('Connecting to database...');
  if(!em || !pw) return toast('Enter email & password');
  try{
    if(type==='login'){
      const { data, error } = await sb.auth.signInWithPassword({ email: em, password: pw });
      if(error) throw error;
      currentUser = data.user;
      toast('Welcome back! Logged in.');
      close();
      loadFromCloud();
    } else {
      const { data, error } = await sb.auth.signUp({ email: em, password: pw });
      if(error) throw error;
      if(data.user && !data.session){
        toast('Confirm email sent! Check inbox.');
      } else {
        currentUser = data.user;
        toast('Account created & logged in!');
        syncToCloud();
      }
      close();
    }
    render();
  }catch(err){
    toast(err.message || 'Authentication failed');
  }
}

  else if(D.sd){sel=D.sd;render()}
  else if(D.add!==undefined)openAdd();
  else if(D.e)openAdd((S.tx||[]).find(t=>t.id===D.e));
  else if(D.ty){A.type=D.ty;if(!((S.cats&&S.cats[D.ty])||[]).find(x=>x[0]===A.cat))A.cat='';addR()}
  
  else if(D.a==='close')$('#pg').classList.remove('on');
  else if(D.a==='cat')pickSheet('cat');
  else if(D.a==='acc')pickSheet('acc');
  else if(D.a==='to')pickSheet('to');
  else if(D.a==='done')doneAdd();
  else if(D.a==='del'){
    const t=(S.tx||[]).find(x=>x.id===A.id);
    S.tx=(S.tx||[]).filter(x=>x.id!==A.id);
    save();$('#pg').classList.remove('on');render();
    toast('Transaction deleted',()=>{S.tx.push(t);save();render()});
  }
  else if(D.pc){A.cat=D.pc;close();addR()}
  else if(D.pa){const[kd,id]=D.pa.split(':');if(kd==='to')A.to=id;else A.acc=id;close();addR()}
  else if(D.undo){if(undo)undo();$('#tt').style.display='none'}
  else if(D.md!==undefined){if(D.md==='add')accSheet();else{mode=D.md;render()}}
  else if(D.ea)accSheet(D.ea);
  else if(D.x){
    const x=D.x;
    if(x==='auth')authSheet();
    else if(x==='manualsync'){await syncToCloud();await loadFromCloud();toast('Synced with cloud ✓');close()}
    else if(x==='logout'){const sb=getSB();if(sb)await sb.auth.signOut();currentUser=null;close();render();toast('Logged out')}
    else if(x==='pin')pinSheet();
    else if(x==='pdf')printableStatement();
    else if(x==='theme'){const r=document.documentElement,l=r.dataset.theme==='light'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:light)').matches);r.dataset.theme=l?'dark':'light';close()}
    else if(x==='calcbox'){
      sheet(`<div class="sh2">Quick CalcBox</div><input class="f" id="cb_in" placeholder="e.g. 500+250-80" autofocus><div id="cb_res" style="font:800 28px Sora;color:var(--inc);margin-bottom:12px">0</div><button type="button" class="ok" id="cb_use">Use as amount</button>`);
      const cin=$('#cb_in'),cres=$('#cb_res');
      cin.oninput=()=>{try{const val=Function('"use strict";return ('+cin.value.replace(/[^0-9+\-*/.]/g,'')+')')();cres.textContent=val?R(val):'0'}catch(e){}};
      $('#cb_use').onclick=()=>{openAdd();A.amt=cres.textContent.replace(/[^0-9.]/g,'');close();addR();};
    }
    else if(x==='bk'){
      sheet(`<div class="sh2">Backup & Restore</div><button type="button" class="ok" id="cp_bk_btn" style="margin-bottom:12px">Copy Full Backup</button><label class="lab">Restore JSON</label><textarea class="f" name="j" rows="4" placeholder="Paste backup JSON"></textarea><button class="ok" style="background:var(--exp);color:#fff">Restore Data</button>`,fd=>{
        try{const j=JSON.parse(fd.get('j'));if(j.acc&&j.tx){S=cleanState(j);save();close();render();toast('Backup restored ✓')}}catch(z){toast('Invalid backup data')}
      });
      $('#cp_bk_btn').onclick=()=>{navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Backup copied to clipboard'))};
    }
    else if(x==='feedback'){
      sheet(`<div class="sh2">Feedback & Support</div><p style="color:var(--mu);margin-bottom:12px">Built with care for easy personal finance management.</p><textarea class="f" rows="4" placeholder="Write your suggestion or issue..."></textarea><button type="button" class="ok" onclick="close();toast('Feedback received! Thank you.')">Submit</button>`);
    }
    else if(x==='about'){
      sheet(`<div class="sh2">About Wallet Manager</div>
      <div style="text-align:center;padding:10px 0">
        <div style="font-size:48px;margin-bottom:6px">👛</div>
        <h3 style="font:800 20px Sora">Wallet Manager</h3>
        <p style="color:var(--mu);font-size:13px;margin:6px 0 16px">Modern, Offline-First Personal Finance Tracker</p>
        <div style="background:var(--c2);padding:14px;border-radius:18px;font-size:13px;line-height:1.6">
          Handcrafted by <b>KM (Kamlesh Mali)</b><br>
          <small style="color:var(--mu)">Equipped with Cloud Sync, Built-in Keypad & Instant Reports</small>
        </div>
      </div>
      <button type="button" class="ok" onclick="close()" style="margin-top:14px">Close</button>`);
    }
    else if(x==='fresh'){
      if(fresh){S.tx=[];S.bud={total:0,cat:{}};(S.acc||[]).forEach(a=>a.open=0);save();fresh=0;close();render();toast('All cleared!')}
      else{fresh=1;toast('Tap "Reset Data" again to erase all records');setTimeout(()=>fresh=0,4000)}
    }
  }
});

// Dynamic Inputs in Add Page
document.addEventListener('input',e=>{
  if(!A) return;
  const i=e.target.id;
  if(i==='an')A.note=e.target.value;
  if(i==='atag')A.tag=e.target.value;
  if(i==='asplit')A.splitWith=e.target.value;
  if(i==='ad')A.date=e.target.value;
  if(i==='at')A.time=e.target.value;
});

document.onkeydown=e=>{if(e.key==='Escape'){close();$('#pg').classList.remove('on')}};

// Passcode Lock UI
let en='';const lk=$('#lk');const lockUI=()=>{$('#dots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<en.length?'f1':''}"></i>`).join('')};
$('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-lk="${k}">${k}</button>`).join('');
$('#pad').onclick=e=>{
  const b=e.target.closest('[data-lk]');if(!b)return;
  const k=b.dataset.lk;
  if(k==='⌫')en=en.slice(0,-1);else if(en.length<4)en+=k;
  lockUI();
  if(en.length===4){
    if(hp(en)===S.pin){lk.classList.remove('on');en=''}
    else{$('#lm').textContent='Wrong passcode, try again';en=''}
    setTimeout(lockUI,150);
  }
};
const lock=()=>{if(S.pin){en='';$('#lm').textContent='Enter passcode';lockUI();lk.classList.add('on')}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)lock()});

// Initial startup
lock();
render();

// Safe Supabase Session Check
function checkSession(){
  const sb = getSB();
  if(!sb){ setTimeout(checkSession, 500); return; }
  try {
    sb.auth.getSession().then(({ data }) => {
      if(data && data.session && data.session.user){
        currentUser = data.session.user;
        loadFromCloud();
        render();
      }
    }).catch(e=>console.warn(e));

    sb.auth.onAuthStateChange((_event, session) => {
      currentUser = session ? session.user : null;
      render();
    });
  } catch(e) { console.warn(e); }
}
checkSession();

// Service worker update
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(registrations => {
    for(let r of registrations) r.update();
  });
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
</script>
