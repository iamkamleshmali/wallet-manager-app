<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wallet Manager</title>
<meta name="theme-color" content="#0e0f14">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23121524'/%3E%3Crect x='16' y='30' width='68' height='50' rx='14' fill='%231b2034' stroke='%232979ff' stroke-width='4'/%3E%3Ccircle cx='75' cy='55' r='5' fill='%23ff3b56'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(e=>console.error('SW register error:',e));
  });
}
</script>

<style>
:root{
 --bg:#0e0f14;--c1:#151822;--c2:#1e2333;--c3:#2a3148;
 --ink:#f5f6fb;--mu:#8a91a8;--ln:#24283b;
 --inc:#2979ff;--exp:#ff3b56;--trf:#8c7ae6;--acc:#2979ff;
 color-scheme:dark
}
@media(prefers-color-scheme:light){
 :root:not([data-theme=dark]){
  --bg:#f2f4fa;--c1:#fff;--c2:#e8ecf6;--c3:#dbe1f2;
  --ink:#111420;--mu:#6a728a;--ln:#dce1ef;
  --inc:#1976d2;--exp:#e53935;--trf:#7b1fa2;--acc:#1976d2;color-scheme:light
 }
}
:root[data-theme=light]{
 --bg:#f2f4fa;--c1:#fff;--c2:#e8ecf6;--c3:#dbe1f2;
 --ink:#111420;--mu:#6a728a;--ln:#dce1ef;
 --inc:#1976d2;--exp:#e53935;--trf:#7b1fa2;--acc:#1976d2;color-scheme:light
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:500 14px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,.big,.num{font-family:Sora,'Plus Jakarta Sans',sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

main{max-width:480px;margin:auto;padding:14px 14px 110px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.top small{color:var(--mu);font-size:11.5px;font-weight:600}
.top h1{font-size:21px;font-weight:800;margin-top:2px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--inc),#7357ff);color:#fff;display:grid;place-items:center;font:800 14px Sora;border:2px solid var(--c1);box-shadow:0 4px 15px rgba(41,121,255,.25)}
.avatar:active{transform:scale(.94)}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;background:var(--c1);border:1px solid var(--ln);border-radius:18px;padding:12px 14px;align-items:center}
.sumcol{text-align:center}
.sumcol small{display:block;color:var(--mu);font-size:11px;font-weight:700;margin-bottom:4px;letter-spacing:.2px;text-transform:capitalize}
.sumcol b{font:700 14px Sora;display:block;white-space:nowrap}
.sumcol .income{color:var(--inc)}
.sumcol .expense{color:var(--exp)}
.sumcol .total{color:var(--ink)}

.bar2{margin:6px 0 12px;display:flex;justify-content:center}
.mn{display:inline-flex;align-items:center;background:var(--c1);border-radius:99px;padding:2px;border:1px solid var(--ln)}
.mn button{width:30px;height:30px;font-size:18px;text-align:center}
.mn b{min-width:100px;text-align:center;font-size:12px;font-weight:700}

.day{background:var(--c1);border-radius:18px;padding:6px 14px 2px;margin-bottom:10px;border:1px solid var(--ln)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:7px 0 9px;border-bottom:1px solid var(--ln);color:var(--mu);font-size:11.5px;font-weight:600}
.dh-left{display:flex;align-items:center;gap:6px}
.dh-date{font:800 17px Sora;color:var(--ink);line-height:1}
.dh-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--c2);color:var(--ink)}
.dh-badge.sun{background:rgba(255,59,86,.18);color:var(--exp)}
.dh-badge.sat{background:rgba(41,121,255,.18);color:var(--inc)}
.dh-sub{font-size:11px;color:var(--mu)}
.dh-right{display:flex;gap:10px;align-items:center;font-weight:700;font-size:11.5px}

.r{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;width:100%;padding:10px 0;text-align:left}
.r+.r{border-top:1px solid var(--ln)}
.ic{width:36px;height:36px;border-radius:12px;background:var(--c2);display:grid;place-items:center;font-size:17px}
.r b{font-size:13px;font-weight:600;display:block}
.r small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
.num{font-weight:700;font-size:13.5px;white-space:nowrap;font-family:Sora,sans-serif}
.i{color:var(--inc)}.e{color:var(--exp)}.t{color:var(--trf)}
.empty{text-align:center;color:var(--mu);padding:45px 10px;font-size:13px}

.card{background:var(--c1);border-radius:20px;padding:16px;margin-bottom:10px;border:1px solid var(--ln)}
.card h2{font-size:14px;margin-bottom:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.grid3>div{background:var(--c1);border-radius:16px;padding:10px;border:1px solid var(--ln)}
.grid3 small{display:block;color:var(--mu);font-size:10px;margin-bottom:4px}
.grid3 b{font:700 12px Sora}

.sg{display:flex;background:var(--c1);border-radius:99px;padding:2px;border:1px solid var(--ln)}
.sg button{flex:1;padding:7px 10px;border-radius:99px;font-size:11.5px;font-weight:700;color:var(--mu)}
.sg .on{background:var(--c2);color:var(--ink)}

.ring{display:block;margin:4px auto 10px;width:190px;height:190px}
.lg{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:8px 0}
.lg i{width:10px;height:10px;border-radius:3px}
.lg .bt{grid-column:2/4;height:5px;border-radius:4px;background:var(--c2);overflow:hidden}
.lg .bt u{display:block;height:100%}
.wk{display:flex;align-items:flex-end;gap:6px;height:95px}
.wk div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:10px;color:var(--mu)}
.wk i{width:100%;border-radius:6px;background:var(--exp);min-height:4px}

.acc{width:100%;background:var(--c1);border:1px solid var(--ln);border-radius:18px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.acl{display:flex;align-items:center;gap:10px}
.aci{width:38px;height:38px;border-radius:13px;background:var(--c2);display:grid;place-items:center;font-size:18px}
.acc small{color:var(--mu);font-size:11px}

.more-wrap{display:flex;flex-direction:column;min-height:calc(100vh - 190px);justify-content:space-between}
.more{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.mi{background:var(--c1);border:1px solid var(--ln);border-radius:20px;padding:20px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.mi:active{transform:scale(.97)}
.mic{width:46px;height:46px;border-radius:16px;background:var(--c2);display:grid;place-items:center;color:var(--ink)}
.mi span{font-size:12px;font-weight:700}
.foot{text-align:center;margin:32px 0 16px;color:var(--mu);font-size:11.5px;line-height:1.6}

.fab-add{position:fixed;right:max(20px,calc(50% - 220px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--inc),#7357ff);color:#fff;display:grid;place-items:center;border:none;cursor:pointer;box-shadow:0 8px 24px rgba(41,121,255,.4);z-index:15;transition:transform .12s ease}
.fab-add:active{transform:scale(.92)}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:456px;background:var(--c1);border:1px solid var(--ln);border-radius:30px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:5px 6px;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.nav button{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:700;color:var(--mu);padding:6px 0;border-radius:18px;gap:2px}
.nav span{font-size:18px;display:grid;place-items:center;line-height:1}
.nav .on{color:var(--ink);background:var(--c2)}

.pg{position:fixed;inset:0;background:var(--bg);z-index:25;display:none;flex-direction:column;overflow:hidden}
.pg.on{display:flex}
.pg .in{max-width:480px;width:100%;margin:auto;flex:1;display:flex;flex-direction:column;padding:10px 14px;overflow-y:auto}
.ph{display:flex;align-items:center;gap:10px;padding:4px 0 10px}
.ph h2{flex:1;font-size:18px}
.ph button{width:38px;height:38px;border-radius:12px;background:var(--c1);display:grid;place-items:center;border:1px solid var(--ln)}
.tp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tp button{padding:10px;border-radius:14px;background:var(--c1);font-weight:700;text-align:center;border:2px solid transparent;font-size:13px}
.fl{display:grid;grid-template-columns:85px 1fr;align-items:center;padding:11px 4px;border-bottom:1px solid var(--ln);width:100%}
.fl label{color:var(--mu);font-size:13px}
.fl input{background:none;border:0;color:var(--ink);padding:0}
.fl input:focus{outline:0}
.amw{font:700 20px Sora;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* NORMAL AMOUNT-ENTRY KEYPAD */
.np{background:var(--c1);border-radius:20px 20px 0 0;padding:0 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);margin-top:auto}
.np-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--c2);border-radius:20px 20px 0 0;border-bottom:1px solid var(--ln);color:var(--mu)}
.np-bar-title{font-size:13px;font-weight:700;color:var(--mu)}
.np-bar-tools{display:flex;align-items:center;gap:12px}
.np-tool-btn{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--mu);cursor:pointer;border:none}
.np-tool-btn:active{color:var(--ink);background:var(--c3)}
.np-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--ln);border-bottom:1px solid var(--ln)}
.np-k{padding:16px 0;background:var(--c1);font:700 20px Sora;text-align:center;color:var(--ink);display:grid;place-items:center;cursor:pointer;border:none;min-height:56px}
.np-k:active{background:var(--c2)}
.np-k.op{background:var(--c1);color:var(--mu);font-size:20px}
.np-k.op:active{background:var(--c2);color:var(--ink)}
.np-k.done{background:#ff5252;color:#fff;font:800 15px 'Plus Jakarta Sans',sans-serif;letter-spacing:.3px}
.np-k.done:active{opacity:.92}

/* SEPARATE CALCULATOR SCREEN */
.calc-screen{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;overflow:hidden}
.calc-screen.on{display:flex}
.calc-top{padding:14px 16px;display:flex;justify-content:flex-end}
.calc-close{width:36px;height:36px;border-radius:10px;background:var(--c1);border:1px solid var(--ln);display:grid;place-items:center;color:var(--mu);cursor:pointer}
.calc-close:active{color:var(--ink);background:var(--c2)}
.calc-disp-area{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:20px 24px;text-align:right}
.calc-expr{font:600 16px Sora;color:var(--mu);min-height:22px;word-break:break-all}
.calc-main-num{font:700 48px Sora;color:var(--ink);line-height:1.1;word-break:break-all}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--ln);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.calc-k{padding:18px 0;background:var(--c1);font:700 20px Sora;text-align:center;color:var(--ink);display:grid;place-items:center;cursor:pointer;border:none;min-height:62px}
.calc-k:active{background:var(--c2)}
.calc-k.op{background:var(--c1);color:var(--mu);font-size:20px}
.calc-k.op:active{background:var(--c2);color:var(--ink)}
.calc-k.done{background:#ff5252;color:#fff;font:800 15px 'Plus Jakarta Sans',sans-serif;letter-spacing:.3px}
.calc-k.done:active{opacity:.92}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:35}
.ov.on{display:flex}
.box{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--c1);padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;border-top:1px solid var(--ln)}
.sh2{font:800 18px Sora;margin-bottom:12px}
.lb{color:var(--mu);font-size:12px;display:block;margin:5px 0}
.f{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);margin-bottom:9px}
textarea.f{min-height:120px;resize:vertical}
.ok{width:100%;padding:13px;border-radius:14px;font-weight:800;font-size:14px;background:var(--acc);color:#fff;text-align:center}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.cg button{background:var(--c2);border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;font-weight:600}
.cg span{display:block;font-size:22px}
.lr{display:flex;justify-content:space-between;padding:13px 4px;width:100%;border-top:1px solid var(--ln)}

#tt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-weight:700;font-size:13px;z-index:70;display:none;max-width:90%}
#tt button{font-weight:800;margin-left:10px;color:var(--exp)}

#lk{position:fixed;inset:0;background:var(--bg);z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#lk.on{display:flex}
.dots{display:flex;gap:12px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mu)}
.dots .f1{background:var(--inc);border-color:var(--inc)}
.pad{display:grid;grid-template-columns:repeat(3,70px);gap:12px}
.pad button{height:70px;border-radius:50%;background:var(--c1);font:700 22px Sora;text-align:center;border:1px solid var(--ln)}

/* SPLASH */
/* SPLASH */
#splash{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s cubic-bezier(.4,0,.2,1),visibility .5s cubic-bezier(.4,0,.2,1)}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splashLogoWrap{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.splashLogoGlow{position:absolute;width:120px;height:120px;border-radius:36px;background:radial-gradient(circle,rgba(41,121,255,.35) 0%,transparent 70%);filter:blur(14px);animation:splashGlow 2.4s ease-in-out infinite}
.splashLogo{width:86px;height:86px;border-radius:26px;background:linear-gradient(135deg,var(--inc),#7357ff);display:grid;place-items:center;color:#fff;font:800 32px Sora;box-shadow:0 16px 40px rgba(41,121,255,.35);position:relative;animation:splashEntrance .9s cubic-bezier(.16,1,.3,1) backwards,splashPop 2.4s ease-in-out .9s infinite}
.splashBrand{display:flex;flex-direction:column;align-items:center;animation:splashFadeUp .8s cubic-bezier(.16,1,.3,1) .2s backwards}
.splashTitle{font:800 22px Sora;letter-spacing:-.4px;color:var(--ink);margin-bottom:3px}
.splashSub{font-size:12px;font-weight:600;color:var(--mu);letter-spacing:.2px}
.splashLoader{width:140px;height:4px;background:var(--c2);border-radius:99px;overflow:hidden;margin-top:26px;position:relative}
.splashProgressBar{height:100%;width:0;background:linear-gradient(90deg,var(--inc),#7357ff);border-radius:99px;animation:splashProgress 1.35s cubic-bezier(.4,0,.2,1) .15s forwards}

@keyframes splashEntrance{0%{opacity:0;transform:scale(.7) translateY(18px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes splashPop{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes splashGlow{0%,100%{opacity:.5;transform:scale(.95)}50%{opacity:.9;transform:scale(1.1)}}
@keyframes splashFadeUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes splashProgress{0%{width:0}35%{width:45%}75%{width:82%}100%{width:100%}}

/* AUTH */
#authGate{position:fixed;inset:0;background:var(--bg);z-index:80;display:none;overflow-y:auto;overflow-x:hidden}
#authGate.on{display:flex;align-items:center;justify-content:center}
.authWrap{width:100%;max-width:420px;margin:auto;padding:36px 20px 28px;display:flex;flex-direction:column;align-items:center;animation:authEntrance .5s cubic-bezier(.16,1,.3,1)}
.authHeader{text-align:center;margin-bottom:20px;display:flex;flex-direction:column;align-items:center}
.authLogo{width:68px;height:68px;border-radius:22px;background:linear-gradient(135deg,var(--inc),#7357ff);display:grid;place-items:center;color:#fff;font:800 26px Sora;margin-bottom:14px;box-shadow:0 12px 32px rgba(41,121,255,.28)}
.authHeader h1{font:800 23px Sora;letter-spacing:-.4px;margin-bottom:5px;color:var(--ink)}
.authHeader .sub{color:var(--mu);font-size:12.5px;font-weight:500;margin:0;line-height:1.4}
.authSeg{display:flex;width:100%;background:var(--c2);border:1px solid var(--ln);border-radius:14px;padding:3px;margin-bottom:14px;gap:3px}
.authSeg button{flex:1;padding:8px 12px;border-radius:11px;font-size:12.5px;font-weight:700;color:var(--mu);text-align:center;transition:all .2s ease;cursor:pointer}
.authSeg button.active{background:var(--c1);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.authCard{width:100%;background:var(--c1);border:1px solid var(--ln);border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;box-shadow:0 12px 36px rgba(0,0,0,.2)}
.authCard .f{border-radius:14px;background:var(--bg);border:1px solid var(--ln);padding:13px 15px;font-size:13.5px;color:var(--ink);margin-bottom:10px;transition:border-color .2s,box-shadow .2s}
.authCard .f:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(41,121,255,.15)}
.authCard .ok{border-radius:14px;font-size:14px;font-weight:800;letter-spacing:.2px;padding:13px;margin-top:4px;box-shadow:0 8px 24px rgba(41,121,255,.3);transition:transform .15s,opacity .15s}
.authCard .ok:active{transform:scale(.98)}
.authSwitch{margin-top:16px;text-align:center;color:var(--mu);font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.authSwitch button{color:var(--inc);font-weight:800;cursor:pointer;padding:2px 4px}
.authSwitch button:hover{text-decoration:underline}
.authMsg{color:var(--mu);font-size:11.5px;text-align:center;margin-top:14px;line-height:1.5;max-width:340px}

@keyframes authEntrance{0%{opacity:0;transform:scale(.97) translateY(12px)}100%{opacity:1;transform:scale(1) translateY(0)}}
</style>
</head>

<body>

<div id="splash">
  <div class="splashLogoWrap">
    <div class="splashLogoGlow"></div>
    <div class="splashLogo">₹</div>
  </div>
  <div class="splashBrand">
    <div class="splashTitle">Wallet Manager</div>
    <div class="splashSub">Smart Money Tracker</div>
  </div>
  <div class="splashLoader">
    <div class="splashProgressBar"></div>
  </div>
</div>

<div id="authGate">
  <div class="authWrap">
    <div class="authHeader">
      <div class="authLogo">₹</div>
      <h1 id="authTitle">Welcome back</h1>
      <div class="sub" id="authSub">Sign in to access your Wallet Manager</div>
    </div>

    <div class="authSeg">
      <button type="button" id="segLogin" class="active" onclick="setAuthMode('login')">Log In</button>
      <button type="button" id="segSignup" onclick="setAuthMode('signup')">Sign Up</button>
    </div>

    <div class="authCard">
      <input class="f" type="email" id="gateEmail" placeholder="Email address" autocomplete="email">
      <input class="f" type="password" id="gatePassword" placeholder="Password" autocomplete="current-password">

      <button class="ok" id="gateBtn">Log In</button>

      <div class="authSwitch">
        <span id="switchText">Don't have an account?</span>
        <button type="button" id="switchAuth">Sign Up</button>
      </div>

      <div class="authMsg" id="authMsg">
        Your data can sync across your devices after signing in.
      </div>
    </div>
  </div>
</div>

<main id="v"></main>

const $=q=>document.querySelector(q);

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'
}[c]));

 minimumFractionDigits:2,maximumFractionDigits:2

const iso=d=>ym(d)+'-'+pd(d.getDate());
const hm=d=>pd(d.getHours())+':'+pd(d.getMinutes());

const DC={
 inc:[
  ['Salary','💼'],['Pocket Money','💸'],['Freelance','💻'],
  ['Scholarship','🎓'],['Gift','🎁'],['Other','💰']
 ],
 exp:[

  ['Study','📚'],['Hostel / Rent','🏠'],['Recharge','📱'],
  ['Fun','🎮'],['Health','💊'],['Social Life','👫'],['Other','✨']
 ]

 'Cash','Accounts','Card','Debit Card','Savings',
 'Top-Up/Prepaid','Investments','Others'
];

 '#2979ff','#ff3b56','#8c7ae6','#ffc247',

];

 acc:[

  {id:'a2',name:'UPI / Bank',g:'Accounts',open:0}
 ],
 cats:JSON.parse(JSON.stringify(DC)),
 tx:[]
});

const clean=r=>{
 const d=seed();
 if(!r||typeof r!=='object')return d;
 return{
  acc:Array.isArray(r.acc)&&r.acc.length?r.acc:d.acc,
  cats:r.cats&&r.cats.inc&&r.cats.exp?r.cats:d.cats,
  tx:Array.isArray(r.tx)?r.tx:[]
 };
};

try{
 S=clean(JSON.parse(localStorage.getItem('gz2')))
}catch(e){

}

let PIN=localStorage.getItem('gz_pin')||'';

let off=0;
let st='exp';

 s+
 (t.type==='inc'&&t.acc===a.id?t.amt:
  t.type==='exp'&&t.acc===a.id?-t.amt:

   (t.to===a.id?t.amt:0)-(t.acc===a.id?t.amt:0):0),

const ce=(ty,n)=>

const sum=(L,ty)=>L.filter(t=>t.type===ty)

const mdate=()=>{
 const d=new Date();
 d.setDate(1);
 d.setMonth(d.getMonth()+off);

};

const sortT=L=>L.slice().sort((a,b)=>
 ((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||''))
);

 const y=new Date();

 return x===iso(new Date())?'Today':

const mbar=d=>`
<div class="mn">

</div>`;

function toast(m,u){
 const t=$('#tt');
 t.innerHTML=esc(m)+(u?'<button data-undo="1">Undo</button>':'');
 undo=u||null;
 t.style.display='block';
 clearTimeout(t._t);
 t._t=setTimeout(()=>t.style.display='none',u?4500:2800);
}

/* =========================
   CLOUD SYNC
========================= */

const stamp=()=>+localStorage.getItem('gz_mod')||0;

const hasLocalData=()=>Boolean(
 (Array.isArray(S?.tx)&&S.tx.length>0)||
 (Array.isArray(S?.acc)&&S.acc.some(a=>Number(a.open||0)!==0))
);

async function push(){
 const c=getSB();
 if(!c||!user)return false;

 const ts=Date.now();

 try{
  const{error}=await c.from('user_data').upsert({
   user_id:user.id,
   data:S,
   updated_at:new Date(ts).toISOString()
  });

  if(error){
   console.error(error);
   toast('Sync failed: '+error.message);
   return false;
  }

  localStorage.setItem('gz_mod',ts);
  return true;
 }catch(err){
  console.error(err);
  return false;
 }
}

let tm;

const sync=()=>{
 if(user){
  clearTimeout(tm);
  tm=setTimeout(push,400);
 }
};

const save=()=>{
 try{
  localStorage.setItem('gz2',JSON.stringify(S));
  localStorage.setItem('gz_mod',Date.now());
 }catch(e){}
 sync();
};

async function pull(){
 const c=getSB();
 if(!c||!user)return;

 try{
  const{data,error}=await c.from('user_data')
   .select('data,updated_at')
   .eq('user_id',user.id)
   .maybeSingle();

  if(error){
   console.error(error);
   toast('Cloud load failed: '+error.message);
   return;
  }

  const cloudHasValidData=Boolean(
   data&&data.data&&Array.isArray(data.data.acc)&&data.data.acc.length
  );
  const ct=data&&data.updated_at?new Date(data.updated_at).getTime():0;

  if(cloudHasValidData){
   if(hasLocalData()&&stamp()>ct){
    await push();
   }else{
    S=clean(data.data);
    localStorage.setItem('gz2',JSON.stringify(S));
    localStorage.setItem('gz_mod',ct);
    render();
   }
  }else{
   if(hasLocalData()){
    await push();
   }
  }
 }catch(err){
  console.error(err);
  toast('Cloud sync offline or unavailable');
 }
}

   <b>${tr?'Transfer':esc(t.cat)}</b>
   <small>
    ${esc(t.note)||esc(accN(t.acc))}
    ${tr?' → '+esc(accN(t.to)):''}
   </small>
  </div>
  <span class="num ${c}">${sg}${R0(t.amt)}</span>
 </button>`;
};

========================= */
function render(){

 const d=mdate();
 const k=ym(d);
 const L=S.tx.filter(t=>t.date&&t.date.startsWith(k));
 const inc=sum(L,'inc');
 const exp=sum(L,'exp');

 let h='';

 /* NAV - EXACTLY 4 TABS */

  ['s',svgIcon('stats'),'Stats'],
  ['a',svgIcon('accounts'),'Accounts'],

 ];

 $('#nav').className='nav';

 $('#nav').innerHTML=items.map(([i,iconSvg,n])=>`
  <button data-t="${i}" class="${tab===i?'on':''}">
   <span>${iconSvg}</span>${n}
  </button>
 `).join('');

 /* TRANSACTIONS */
 if(tab==='h'){
  const tot=S.acc.reduce((s,a)=>s+bal(a),0);
  const hr=new Date().getHours();

  h=`
  <div class="top">
   <div>
    <small>
     ${hr<12?'Good morning':hr<18?'Good afternoon':'Good evening'}
    </small>
    <h1>Transactions</h1>
   </div>

   <div style="display:flex;align-items:center;gap:8px">
    <button class="avatar" data-x="auth">${avatarText()}</button>
   </div>
  </div>

  <div class="summary">
   <div class="sumcol">
    <small>Income</small>
    <b class="income">${R0(inc)}</b>
   </div>

   <div class="sumcol">
    <small>Expenses</small>
    <b class="expense">${R0(exp)}</b>
   </div>

   <div class="sumcol">
    <small>Total</small>
    <b class="total">${tot<0?'−':''}${R0(Math.abs(tot))}</b>
   </div>
  </div>

  <div class="bar2">${mbar(d)}</div>
  `;

  const ds=[...new Set(L.map(t=>t.date))].sort().reverse();

  h+=ds.length?
   ds.map(x=>{
    const q=sortT(L.filter(t=>t.date===x));
    const dayInc=sum(q,'inc');
    const dayExp=sum(q,'exp');
    const dt=new Date(x+'T00:00');
    const dNum=dt.getDate();
    const dDay=dt.toLocaleString('en-US',{weekday:'short'});
    const dSub=pd(dt.getMonth()+1)+'.'+dt.getFullYear();
    const isSun=dDay==='Sun';
    const isSat=dDay==='Sat';

    return`
    <div class="day">
     <div class="dh">
      <div class="dh-left">
       <span class="dh-date">${dNum}</span>
       <span class="dh-badge ${isSun?'sun':isSat?'sat':''}">${dDay}</span>
       <span class="dh-sub">${dSub}</span>
      </div>
      <div class="dh-right">
       ${dayInc>0?`<span class="i">${R0(dayInc)}</span>`:''}
       ${dayExp>0?`<span class="e">${R0(dayExp)}</span>`:''}
      </div>
     </div>
     ${q.map(row).join('')}
    </div>`;
   }).join(''):
   `<div class="empty">
     No records this month.<br>
     Tap the <b style="color:var(--inc)">+</b> button below to add one.
    </div>`;

  h+=`
  <button class="fab-add" data-add="1" aria-label="Add transaction">
   ${svgIcon('plus')}
  </button>`;
 }

 /* STATS */
 if(tab==='s'){
  let F=S.tx;

  if(per==='w'){
   const w=new Date();
   w.setDate(w.getDate()-6);
   F=F.filter(t=>t.date>=iso(w))
  }else if(per==='y'){
   F=F.filter(t=>t.date&&t.date.startsWith(String(d.getFullYear())))
  }else{
   F=F.filter(t=>t.date&&t.date.startsWith(k))
  }

  const map={};

  F.filter(t=>t.type===st).forEach(t=>{
   map[t.cat]=(map[t.cat]||0)+t.amt
  });

  const es=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const tot=es.reduce((s,e)=>s+e[1],0);
  const C=2*Math.PI*74;
  let a=0,arcs='';

  es.forEach(([c,v],i)=>{
   const l=v/tot*C;
   arcs+=`
   <circle r="74" cx="100" cy="100"
    fill="none"
    stroke="${COL[i%8]}"
    stroke-width="24"
    stroke-dasharray="${Math.max(l-3,1)} ${C}"
    stroke-dashoffset="${-a}"
    transform="rotate(-90 100 100)"/>`;
   a+=l;
  });

  const days=[...Array(7)].map((_,i)=>{
   const x=new Date();
   x.setDate(x.getDate()-6+i);
   return[
    x.toLocaleString('en-US',{weekday:'narrow'}),
    sum(S.tx.filter(t=>t.date===iso(x)),'exp')
   ];
  });

  const mx=Math.max(...days.map(x=>x[1]),1);

  h=`
  <div class="top">

function ev(s){
 const t=s.match(/\d*\.?\d+|[-+*\/]/g)||[];

 while(t.length&&/^[-+*\/]$/.test(t[t.length-1]))t.pop();
 if(!t.length)return 0;

 const n=[+t[0]],o=[];

 for(let i=1;i<t.length;i+=2){
  const op=t[i],v=+t[i+1];

  if(op==='*')n[n.length-1]*=v;
  else if(op==='/')n[n.length-1]=v?n[n.length-1]/v:NaN;
  else{
   o.push(op);
   n.push(v)
  }
 }

 return n.reduce((s,v,i)=>
  i?(o[i-1]==='+'?s+v:s-v):s
 );
}

function calcKey(k){
 if(k==='close'){
  closeCalculator();
  return;
 }

 if(k==='done'){
  const v=ev(calcExpr);
  const finalAmt=isFinite(v)?Math.round(v*100)/100:0;
  ex=finalAmt?String(finalAmt):'';
  updDisp();
  closeCalculator();
  return;
 }

 if(k==='ac'){
  calcExpr='0';
  renderCalculator();
  return;
 }

 if(k==='⌫'){
  calcExpr=calcExpr.length>1?calcExpr.slice(0,-1):'0';
  renderCalculator();
  return;
 }

 if(k==='='){
  const v=ev(calcExpr);
  calcExpr=isFinite(v)?String(Math.round(v*10000)/10000):'0';
  renderCalculator();
  return;
 }

 if(/^[-+*\/]$/.test(k)){
  if(!calcExpr)calcExpr='0';
  if(/[-+*\/]$/.test(calcExpr)){
   calcExpr=calcExpr.slice(0,-1)+k;
  }else{
   calcExpr+=k;
  }
  renderCalculator();
  return;
 }

 if(k==='.'){
  const lastChunk=calcExpr.split(/[-+*\/]/).pop()||'';
  if(lastChunk.includes('.'))return;
  calcExpr+=(lastChunk?'.':'0.');
  renderCalculator();
  return;
 }

 // Numbers & 00
 if(calcExpr==='0'&&k!=='00')calcExpr=k;
 else if(calcExpr==='0'&&k==='00')calcExpr='0';
 else calcExpr+=k;

 renderCalculator();
}

function key(k){
 if(!k)return;

 if(k==='done'){
  const v=amt();

  if(v===0)return toast('Enter an amount');

  if(A.type!=='trf'&&!A.cat)return pick('cat');

  return saveTx(v);
 }

 if(k==='calc'){
  openCalculator();
  return;
 }

 if(k==='clear'){
  ex='';
  updDisp();
  return;
 }

 if(k==='⌫'){
  ex=ex.slice(0,-1);
  updDisp();
  return;
 }

 if(k==='-'){
  if(ex.startsWith('-'))ex=ex.slice(1);
  else ex='-'+ex;
  updDisp();
  return;
 }

 if(k==='.'){
  const raw=ex.startsWith('-')?ex.slice(1):ex;
  if(raw.includes('.'))return;
  ex+=raw?'.':'0.';
  updDisp();
  return;
 }

 const raw=ex.startsWith('-')?ex.slice(1):ex;
 if(raw.includes('.')&&raw.split('.')[1].length>=2)return;
 if(raw.length>=9)return;

 if(raw==='0')ex=(ex.startsWith('-')?'-':'')+k;
 else ex+=k;

 updDisp();
}

   PASSCODE
========================= */

const legacyHp=p=>btoa('wm_'+p+'_pin');

async function hashPin(p){
 const enc=new TextEncoder();
 const data=enc.encode('wm_salt_2026_'+p+'_wallet');
 const buf=await crypto.subtle.digest('SHA-256',data);
 const arr=Array.from(new Uint8Array(buf));
 return 'sha256:'+arr.map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function verifyPin(enteredPin,storedHash){
 if(!storedHash||!enteredPin)return false;

 if(storedHash.startsWith('sha256:')){
  const h=await hashPin(enteredPin);
  return h===storedHash;
 }

 if(legacyHp(enteredPin)===storedHash){
  try{
   const newHash=await hashPin(enteredPin);
   PIN=newHash;
   localStorage.setItem('gz_pin',newHash);
  }catch(e){}
  return true;
 }

 return false;
}

  `:

  `,
 async fd=>{

   PIN='';
   localStorage.removeItem('gz_pin');

  }else{
   PIN=await hashPin(p);

   toast('Passcode enabled');
  }

  closeSheet();
 });
}

function csvEscape(v){
 return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
}

function makeBackupCSV(){
 const rows=[
  ['Wallet Manager Backup','Version','2'],
  ['META','Exported At',new Date().toISOString()],
  ['KIND','ID','NAME','GROUP','OPEN','TYPE','EMOJI','DATE','TIME','CATEGORY','ACCOUNT','TO','AMOUNT','NOTE']
 ];

 S.acc.forEach(a=>{
  rows.push(['ACCOUNT',a.id,a.name,a.g,a.open,'','','','','','','','','']);
 });

 Object.entries(S.cats).forEach(([type,list])=>{
  list.forEach(c=>{
   rows.push(['CATEGORY','',c[0],'','',type,c[1],'','','','','','','']);
  });
 });

 sortT(S.tx).forEach(t=>{
  rows.push(['TRANSACTION',t.id,'','','',t.type,'',t.date||'',t.time||'',t.cat||'',t.acc||'',t.to||'',t.amt||0,t.note||'']);
 });

 return '\ufeff'+rows.map(r=>r.map(csvEscape).join(',')).join('\n');
}

/* CSV parser */
function parseCSV(text){
 const rows=[];
 let row=[];
 let cell='';
 let quote=false;

 for(let i=0;i<text.length;i++){
  const ch=text[i];

  if(ch==='"'){
   if(quote&&text[i+1]==='"'){
    cell+='"';
    i++;
   }else{
    quote=!quote;
   }
  }else if(ch===','&&!quote){
   row.push(cell);
   cell='';
  }else if((ch==='\n'||ch==='\r')&&!quote){
   if(ch==='\r'&&text[i+1]==='\n')i++;
   row.push(cell);
   if(row.some(x=>x!==''))rows.push(row);
   row=[];
   cell='';
  }else{
   cell+=ch;
  }
 }

 if(cell!==''||row.length){
  row.push(cell);
  if(row.some(x=>x!==''))rows.push(row);
 }

 return rows;
}

async function restoreBackup(file){
 try{
  const text=await file.text();

  /* Keep old JSON backups working */
  if(file.name.toLowerCase().endsWith('.json')){
   const j=JSON.parse(text);

   if(!(j.acc&&j.tx))throw new Error('Invalid backup');

   S=clean(j);
   save();
   closeSheet();
   render();
   toast('Backup restored ✓');
   return;
  }

  const rows=parseCSV(text);
  const accounts=[];
  const cats={
   inc:[],
   exp:[]
  };
  const tx=[];

  for(const r of rows){
   if(r[0]==='ACCOUNT'){
    accounts.push({
     id:r[1]||uid(),
     name:r[2]||'Account',
     g:r[3]||'Others',
     open:Number(r[4])||0
    });
   }

   if(r[0]==='CATEGORY'){
    const type=r[5];
    if(type==='inc'||type==='exp'){
     cats[type].push([
      r[2]||'Other',
      r[6]||'✨'
     ]);
    }
   }

   if(r[0]==='TRANSACTION'){
    tx.push({
     id:r[1]||uid(),
     type:r[5]||'exp',
     cat:r[9]||'',
     amt:Number(r[12])||0,
     note:r[13]||'',
     acc:r[10]||'',
     to:r[11]||'',
     date:r[7]||iso(new Date()),
     time:r[8]||''
    });
   }
  }

  if(!accounts.length)throw new Error('No accounts');

  S=clean({
   acc:accounts,
   cats:{
    inc:cats.inc.length?cats.inc:DC.inc,
    exp:cats.exp.length?cats.exp:DC.exp
   },
   tx
  });

  save();
  closeSheet();
  render();
  toast('Backup restored ✓');

 }catch(e){
  console.error(e);
  toast('Invalid backup file');
 }
}

function dl(name,text,type){
 const b=new Blob([text],{type});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(b);
 a.download=name;
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

async function xact(x,D){

 if(x==='auth'){
  authSheet();
 }

 else if(x==='new_acc'){
  accSheet();
 }

 else if(x==='delacc'){
  const id=D.id;

  if(S.acc.length<2)
   return toast('Keep at least one account');

  if(S.tx.some(t=>t.acc===id||t.to===id))
   return toast('This account has records. Delete them first');

  S.acc=S.acc.filter(a=>a.id!==id);

  save();
  closeSheet();
  render();
 }

 else if(x==='msync'){
  if(await push()){
   await pull();
   closeSheet();
   toast('Synced ✓');
  }
 }

 else if(x==='logout'){

  const c=getSB();

  if(c&&user){
   try{
    await push();
   }catch(err){
    console.error('Final sync before logout skipped or failed:',err);
   }

   try{
    await c.auth.signOut();
   }catch(err){
    console.error('Sign out error:',err);
   }
  }

  user=null;
  bootReady=false;

  S=seed();

  localStorage.removeItem('gz2');
  localStorage.removeItem('gz_mod');

  closeSheet();
  $('#authGate').classList.add('on');

  setAuthMode('login');
  toast('Logged out');
 }

 else if(x==='pin'){
  pinSheet();
 }

 else if(x==='theme'){
  const r=document.documentElement;

  const light=
   r.dataset.theme==='light'||
   (!r.dataset.theme&&matchMedia('(prefers-color-scheme:light)').matches);

  r.dataset.theme=light?'dark':'light';

  localStorage.setItem(
   'gz_theme',
   r.dataset.theme
  );

  render();
 }

 else if(x==='bk'){
  bkSheet();
 }

 else if(x==='bkdl'){
  downloadBackup();
 }

 else if(x==='feedback'){
  feedbackSheet();
 }

 else if(x==='about'){
  sheet(`
   <div class="sh2">About Wallet Manager</div>

   <p style="
    color:var(--mu);
    font-size:13px;
    line-height:1.7;

   </div>

   <button type="button"
    class="ok"
    data-x="closesheet">
    Close
   </button>
  `);
 }

 else if(x==='closesheet'){
  closeSheet();
 }

 else if(x==='fresh'){
  if(fresh){
   S.tx=[];
   S.acc.forEach(a=>a.open=0);
   save();

document.addEventListener('click',async e=>{

 if(e.target===$('#ov')){
  return closeSheet();
 }

 const c=e.target.closest(`
  [data-t],[data-o],[data-st],[data-per],
  [data-e],[data-ty],[data-a],[data-pc],
  [data-pa],[data-add],[data-x],[data-undo],
  [data-ea],[data-k],[data-ck]
 `);

 if(!c)return;

 const D=c.dataset;

 if(D.ck!==undefined){
  calcKey(D.ck);
 }

 else if(D.k!==undefined){
  key(D.k);
 }

 else if(D.per){
  per=D.per;
  render();
 }

 else if(D.t){
  tab=D.t;
  render();
  window.scrollTo(0,0);
 }

 else if(D.o){
  off=Math.min(0,off+ +D.o);
  render();
 }

 else if(D.st){
  st=D.st;
  render();
 }

 else if(D.add!==undefined){
  openAdd();
 }

 else if(D.e){
  const t=S.tx.find(t=>t.id===D.e);
  if(t)openAdd(t);
 }

 else if(D.ty){
  A.type=D.ty;

  if(!(S.cats[D.ty]||[]).find(x=>x[0]===A.cat))
   A.cat='';

  addR();
 }

 else if(D.a==='close'){
  $('#pg').classList.remove('on');
 }

 else if(D.a==='cat'||D.a==='acc'||D.a==='to'){
  pick(D.a);
 }

 else if(D.a==='del'){
  const t=S.tx.find(x=>x.id===A.id);

  S.tx=S.tx.filter(x=>x.id!==A.id);

  save();
  $('#pg').classList.remove('on');
  render();

  toast('Deleted',()=>{
   if(t){
    S.tx.push(t);
    save();
    render();
   }
  });
 }

 else if(D.pc){
  A.cat=D.pc;
  closeSheet();
  addR();
 }

 else if(D.pa){
  const[k,id]=D.pa.split(':');

  if(k==='to')A.to=id;
  else A.acc=id;

  closeSheet();
  addR();
 }

 else if(D.undo){
  if(undo)undo();
  $('#tt').style.display='none';
 }

 else if(D.ea){
  accSheet(D.ea);
 }

 else if(D.x){
  await xact(D.x,D);
 }
});

};

function formatAuthError(msg){
 if(!msg)return 'Authentication failed. Please try again.';
 const m=msg.toLowerCase();
 if(m.includes('invalid login credentials')||m.includes('invalid credentials'))
  return 'Incorrect email or password. Please verify and try again.';
 if(m.includes('user already registered'))
  return 'An account with this email already exists. Please log in.';
 if(m.includes('password should be at least'))
  return 'Password must be at least 6 characters long.';
 if(m.includes('network')||m.includes('fetch'))
  return 'Network error. Please check your internet connection.';
 return msg;
}

$('#gateBtn').onclick=async()=>{
 const em=$('#gateEmail').value.trim();
 const pw=$('#gatePassword').value.trim();

 if(!em||!pw)
  return toast('Enter email & password');

 const btn=$('#gateBtn');
 btn.disabled=true;
 btn.textContent='Please wait...';

 try{
  const c=getSB();

  if(!c)throw new Error('Cloud connection unavailable. Please check internet connection.');

  const r=authMode==='login'?
   await c.auth.signInWithPassword({
    email:em,password:pw
   }):
   await c.auth.signUp({
    email:em,password:pw
   });

  if(r.error)throw r.error;

  if(r.data.session){
   user=r.data.user;
   bootReady=true;

   $('#authGate').classList.remove('on');

   await pull();
   render();

   toast(authMode==='login'?'Logged in ✓':'Account created ✓');
  }else{
   $('#authMsg').textContent=
    'Account created. Check your email if confirmation is required, then log in.';
   setAuthMode('login');
   $('#gatePassword').value='';
   toast('Account created ✓');
  }

 }catch(e){
  console.error(e);
  toast(formatAuthError(e.message));
 }finally{
  btn.disabled=false;
  btn.textContent=authMode==='login'?'Log In':'Sign Up';
 }
};

$('#gatePassword').addEventListener('keydown',e=>{
 if(e.key==='Enter')$('#gateBtn').click();
});

$('#gateEmail').addEventListener('keydown',e=>{
 if(e.key==='Enter')$('#gatePassword').focus();
});

/* =========================
   SESSION / STARTUP
========================= */

async function startApp(){

 const th=localStorage.getItem('gz_theme');

 if(th)
  document.documentElement.dataset.theme=th;

 /* Splash */
 await new Promise(resolve=>setTimeout(resolve,1350));

 const c=getSB();

 if(!c){
  $('#splash').classList.add('hide');
  $('#authGate').classList.add('on');
  setAuthMode('login');
  $('#authMsg').textContent=
   'Offline mode: Cloud is currently unreachable. You can continue once connection is restored or sign in when online.';
  return;
 }

 try{
  const{data,error}=await c.auth.getSession();

  if(error)throw error;

  if(data&&data.session&&data.session.user){
   user=data.session.user;
   bootReady=true;

   $('#splash').classList.add('hide');
   $('#authGate').classList.remove('on');

   render();

   await pull();

   render();

   lock();

  }else{
   user=null;
   bootReady=false;

   $('#splash').classList.add('hide');
   $('#authGate').classList.add('on');

   setAuthMode('login');
  }

  c.auth.onAuthStateChange(async(event,s)=>{
   const prevUser=user;
   user=s?s.user:null;

   if(event==='SIGNED_OUT'||!user){
    bootReady=false;
    $('#authGate').classList.add('on');
    setAuthMode('login');
   }else if(user&&(!prevUser||prevUser.id!==user.id)){
    bootReady=true;
    $('#authGate').classList.remove('on');
    render();
   }
  });

 }catch(e){
  console.error(e);
  user=null;
  bootReady=false;

  $('#splash').classList.add('hide');
  $('#authGate').classList.add('on');
  setAuthMode('login');
 }
}

startApp();
</script>
