name: Check Wallet Manager PWA

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Validate Wallet Manager
        run: bubblewrap validate --url=https://wallet-manager-km.vercel.app/
